<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Яндекс Презентации</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Unbounded:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      height: 100%;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 14px;
      background: #f4f6f8;
      color: #1a1a1a;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    :root {
      --orb-spacing-m:        4px;
      --orb-spacing-2-m:      8px;
      --orb-rounding-6-m:     12px;
      --orb-line-generiс:     rgba(181, 183, 192, 0.30);
      --orb-misc-surface-meeting: rgba(255, 255, 255, 0.18);
    }

    /* ===== App header ===== */
    .app-header {
      background: #e3f2fd;
      overflow: visible;
      padding: 12px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 0;
      min-height: 0;
      position: relative;
      z-index: 10;
    }

    .hdr-bg {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 0;
    }
    .hdr-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .header-top,
    .header-menu,
    .header-bottom {
      position: relative;
      z-index: 1;
    }

    .header-top {
      z-index: 10;
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .header-bottom {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      flex: 1;
      overflow: visible;
      min-width: 0;
      min-height: 32px;
      flex-shrink: 0;
    }

    .header-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #d0d0d0;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .header-circle.logo {
      background: transparent;
      cursor: pointer;
      transition: background .15s;
      border-radius: 50%;
    }

    .header-circle.logo:hover {
      background: rgba(0, 0, 0, 0.08);
    }

    .header-top .header-circle.logo:nth-child(2):hover {
      background: transparent;
      cursor: default;
    }

    .header-menu {
      display: flex;
      align-items: center;
      gap: 0;
      flex-shrink: 0;
      margin-top: 2px;
      margin-bottom: 8px;
    }

    .header-menu-btn {
      height: 28px;
      padding: 0 8px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      color: #333;
      transition: background .15s;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
    }

    .header-menu-btn:hover {
      background: rgba(0, 0, 0, 0.08);
    }

    .header-title {
      font-family: 'Inter', 'Google Sans', sans-serif;
      font-weight: 400;
      font-size: 15px;
      color: #3d3d3d;
      margin-left: 4px;
      flex-shrink: 0;
      border-radius: 4px;
      padding: 2px 4px;
      cursor: text;
    }
    .header-title:focus {
      outline: none;
      background: rgba(0,0,0,0.05);
    }

    .header-rect {
      display: flex;
      height: 32px;
      padding: var(--orb-spacing-2-m);
      justify-content: center;
      align-items: center;
      gap: var(--orb-spacing-m);
      border-radius: var(--orb-rounding-6-m);
      border: 1px solid var(--orb-line-generiс);
      background: var(--orb-misc-surface-meeting);
      backdrop-filter: blur(2.5px);
      flex-shrink: 0;
    }

    .header-rect.header-rect-tools {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 2px;
      border-radius: 12px;
      width: fit-content;
    }

    .header-tool-btn {
      position: relative;
      width: 28px;
      height: 28px;
      min-width: 28px;
      min-height: 28px;
      flex-shrink: 0;
      padding: 0;
      border: none;
      background: transparent;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgb(0 0 0 / 75%);
    }
    .header-tool-btn::after {
      content: attr(data-tooltip);
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-top: 6px;
      padding: 4px 8px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      border-radius: 4px;
      font-size: 12px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
      z-index: 1000;
    }
    .header-tool-btn:hover {
      background: rgba(0, 0, 0, 0.06);
    }
    .header-tool-btn:hover::after {
      opacity: 1;
    }
    .header-tool-btn:active {
      background: rgba(0, 0, 0, 0.1);
    }
    .header-tool-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      pointer-events: auto;
    }
    .header-tool-btn:disabled:hover {
      background: transparent;
    }
    .header-tool-btn:disabled::after {
      display: none;
    }
    .header-tool-btn svg {
      width: 15px;
      height: 15px;
    }
    .header-tool-btn svg [stroke] {
      stroke-width: 1.5;
    }

    /* ===== Font dropdown ===== */
    .font-select-wrap {
      position: relative;
      width: 77px;
      height: 28px;
      display: flex;
      align-items: center;
      border-radius: 10px;
      transition: background .15s;
    }
    .font-select-wrap:hover {
      background: rgba(0, 0, 0, 0.06);
    }
    .font-select {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      border: none;
      padding: 0 22px 0 8px;
      font-family: inherit;
      font-size: 14px;
      color: rgb(0 0 0 / 75%);
      cursor: pointer;
      outline: none;
    }
    .font-select-chevron {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: rgb(0 0 0 / 75%);
      display: flex;
    }

    /* ===== Font size control ===== */
    .font-size-wrap {
      display: flex;
      align-items: center;
      gap: 2px;
      height: 28px;
      border-radius: 10px;
    }
    .font-size-value {
      font-size: 14px;
      color: rgb(0 0 0 / 75%);
      min-width: 16px;
      text-align: center;
      user-select: none;
      cursor: default;
    }
    .font-size-wrap .header-tool-btn svg {
      width: 12px;
      height: 12px;
    }

    /* ===== Header top action buttons ===== */
    .header-top-icon-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      border-radius: 10px;
      cursor: pointer;
      color: rgba(0, 0, 0, 0.75);
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .header-top-icon-btn:hover {
      background: rgba(0, 0, 0, 0.06);
    }
    .header-top-icon-btn::after {
      content: attr(data-tooltip);
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-top: 6px;
      padding: 4px 8px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      border-radius: 4px;
      font-size: 12px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
      z-index: 1000;
    }
    .header-top-icon-btn:hover::after {
      opacity: 1;
    }
    .header-share-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 0 10px 0 8px;
      height: 28px;
      border: none;
      background: transparent;
      border-radius: 10px;
      cursor: pointer;
      color: rgba(0, 0, 0, 0.75);
      font-size: 14px;
      font-family: inherit;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .header-share-btn:hover {
      background: rgba(0, 0, 0, 0.06);
    }

    /* ===== Split button ===== */
    .split-btn {
      display: inline-flex;
      align-items: center;
      gap: 1px;
    }
    .split-btn-main {
      border-radius: 10px 0 0 10px !important;
    }
    .split-btn-arrow {
      width: 16px !important;
      min-width: 16px !important;
      border-radius: 0 10px 10px 0 !important;
      padding: 0 !important;
      color: rgb(0 0 0 / 75%);
    }
    .split-btn-arrow svg {
      width: 12px;
      height: 12px;
    }
    .split-btn:hover .split-btn-main,
    .split-btn:hover .split-btn-arrow {
      background: rgba(0, 0, 0, 0.06);
    }
    .split-btn-menu {
      position: fixed;
      display: none;
      flex-direction: column;
      background: #fff;
      border: 1px solid rgba(181, 183, 192, 0.4);
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      z-index: 2000;
      min-width: 160px;
      padding: 4px;
    }
    .split-btn-menu.open {
      display: flex;
    }
    .split-btn-menu-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      background: none;
      border: none;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      font-size: 13px;
      color: rgba(0, 0, 0, 0.8);
      border-radius: 7px;
      width: 100%;
    }
    .split-btn-menu-item:hover {
      background: rgba(0, 0, 0, 0.05);
    }
    .split-btn-color-dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      border: 1px solid rgba(0,0,0,0.15);
      flex-shrink: 0;
    }

    /* ===== Slides workspace ===== */
    .slides-main {
      flex: 1;
      display: flex;
      flex-direction: row;
      min-height: 0;
      overflow: hidden;
    }

    /* --- Sidebar --- */
    .slides-sidebar {
      width: 300px;
      min-width: 120px;
      max-width: 600px;
      flex-shrink: 0;
      background: #f8f9fa;
      border-right: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .sidebar-resize-handle {
      position: absolute;
      top: 0;
      right: -3px;
      width: 6px;
      height: 100%;
      cursor: col-resize;
      z-index: 10;
    }
    .sidebar-resize-handle:hover,
    .sidebar-resize-handle.dragging {
      background: rgba(26, 115, 232, 0.3);
    }

    .slides-sidebar-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 8px 0;
    }

    .slide-thumb-item {
      display: flex;
      align-items: flex-start;
      gap: 4px;
      margin-bottom: 8px;
      position: relative;
    }

    .slide-thumb-item.active .slide-thumb {
      border-color: #f57c00;
      box-shadow: 0 0 0 2px rgba(245,124,0,0.25);
    }

    .slide-thumb-number {
      font-size: 9px;
      color: #9aa0a6;
      width: 12px;
      text-align: right;
      padding-top: 5px;
      flex-shrink: 0;
      line-height: 1;
    }

    .slide-thumb {
      flex: 1;
      background: #fff;
      border: 1px solid #dadce0;
      border-radius: 2px;
      aspect-ratio: 16/9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4px 3px;
      overflow: hidden;
      cursor: pointer;
    }

    .slide-thumb:hover { border-color: #bdc1c6; }

    .slide-thumb-title {
      font-family: 'Inter', sans-serif;
      font-size: 7px;
      font-weight: 500;
      color: #1d1b20;
      text-align: center;
      line-height: 1.3;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .slide-thumb-subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 5px;
      color: #80868b;
      text-align: center;
      margin-top: 2px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .slide-thumb-delete {
      position: absolute;
      top: 1px;
      right: -1px;
      width: 15px;
      height: 15px;
      border: none;
      background: rgba(50,50,50,0.7);
      color: #fff;
      font-size: 11px;
      cursor: pointer;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      line-height: 1;
      padding: 0;
    }

    .slide-thumb-item:hover .slide-thumb-delete { display: flex; }

    .slides-add-btn {
      margin: 7px;
      padding: 0 12px;
      border: none;
      background: #f57c00;
      color: #fff;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-shrink: 0;
      height: 36px;
    }

    .slides-add-btn:hover {
      background: #e65100;
    }

    /* --- Canvas area --- */
    .slides-workspace {
      flex: 1;
      overflow: auto;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 32px 24px 64px;
      background: #f1f3f4;
      min-height: 0;
    }

    .slides-ruler-left {
      display: flex;
      flex-direction: column;
      width: 18px;
      padding-top: 2px;
      flex-shrink: 0;
      user-select: none;
    }

    .slides-ruler-left span {
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      height: calc(540px / 14);
      font-size: 9px;
      color: #9aa0a6;
      line-height: 1;
      padding-right: 2px;
    }

    .slide-canvas {
      width: calc((100vw - 300px) * 0.9);
      height: calc((100vw - 300px) * 0.9 * 9 / 16);
      background: #fff;
      border: 1px solid #dadce0;
      box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 4px 16px rgba(0,0,0,.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      flex-shrink: 0;
    }

    .slide-title-section {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 80px;
    }

    .slide-title-area {
      font-family: 'Inter', sans-serif;
      font-size: 52px;
      font-weight: 400;
      color: #1d1b20;
      text-align: center;
      outline: none;
      min-width: 100px;
      width: 100%;
      caret-color: #444;
    }

    .slide-title-area:empty::before {
      content: attr(data-placeholder);
      color: #c9cace;
      pointer-events: none;
    }

    .slide-subtitle-section {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 80px;
    }

    .slide-subtitle-area {
      font-family: 'Inter', sans-serif;
      font-size: 28px;
      font-weight: 400;
      color: #80868b;
      text-align: center;
      outline: none;
      min-width: 100px;
      width: 100%;
      caret-color: #444;
    }

    .slide-subtitle-area:empty::before {
      content: attr(data-placeholder);
      color: #c9cace;
      pointer-events: none;
    }
  </style>
</head>

<body>

    <main class="slides-main">
    <aside class="slides-sidebar" id="slidesSidebar">
      <div class="slides-sidebar-list" id="slidesList"></div>
      <button class="slides-add-btn" id="addSlideBtn"><svg xmlns="http://www.w3.org/2000/svg" fill="none" width="12" height="12" viewBox="0 0 12 12"><path fill="currentColor" d="M5.25 5.25V1h1.5v4.25H11v1.5H6.75V11h-1.5V6.75H1v-1.5z"/></svg>Новый слайд</button>
      <div class="sidebar-resize-handle" id="sidebarResizeHandle"></div>
    </aside>
    <div class="slides-workspace">
      <div class="slide-canvas">
        <div class="slide-title-section">
          <div class="slide-title-area" id="slideTitle" contenteditable="true" spellcheck="false" data-placeholder="Введите заголовок"></div>
        </div>
        <div class="slide-subtitle-section">
          <div class="slide-subtitle-area" id="slideSubtitle" contenteditable="true" spellcheck="false" data-placeholder="Введите подзаголовок"></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const slides = [
      { title: 'Презентации', subtitle: 'Ждите в 2026' }
    ];
    let currentIndex = 0;

    const titleEl = document.getElementById('slideTitle');
    const subtitleEl = document.getElementById('slideSubtitle');
    const listEl = document.getElementById('slidesList');

    function saveCurrentSlide() {
      slides[currentIndex].title = titleEl.innerText.trim();
      slides[currentIndex].subtitle = subtitleEl.innerText.trim();
    }

    function loadSlide(index) {
      titleEl.innerText = slides[index].title || '';
      subtitleEl.innerText = slides[index].subtitle || '';
    }

    function renderSidebar() {
      listEl.innerHTML = '';
      slides.forEach((slide, i) => {
        const item = document.createElement('div');
        item.className = 'slide-thumb-item' + (i === currentIndex ? ' active' : '');

        const num = document.createElement('div');
        num.className = 'slide-thumb-number';
        num.textContent = i + 1;

        const thumb = document.createElement('div');
        thumb.className = 'slide-thumb';
        thumb.innerHTML =
          '<div class="slide-thumb-title">' + (slide.title || '') + '</div>' +
          '<div class="slide-thumb-subtitle">' + (slide.subtitle || '') + '</div>';
        thumb.addEventListener('click', () => switchToSlide(i));

        const del = document.createElement('button');
        del.className = 'slide-thumb-delete';
        del.textContent = '×';
        del.title = 'Удалить';
        del.addEventListener('click', (e) => { e.stopPropagation(); deleteSlide(i); });

        item.appendChild(num);
        item.appendChild(thumb);
        if (slides.length > 1) item.appendChild(del);
        listEl.appendChild(item);
      });
    }

    function switchToSlide(index) {
      saveCurrentSlide();
      currentIndex = index;
      loadSlide(currentIndex);
      renderSidebar();
    }

    function addSlide() {
      saveCurrentSlide();
      slides.push({ title: '', subtitle: '' });
      currentIndex = slides.length - 1;
      loadSlide(currentIndex);
      renderSidebar();
      titleEl.focus();
    }

    function deleteSlide(index) {
      if (slides.length === 1) return;
      saveCurrentSlide();
      slides.splice(index, 1);
      if (currentIndex >= slides.length) currentIndex = slides.length - 1;
      loadSlide(currentIndex);
      renderSidebar();
    }

    titleEl.addEventListener('input', () => {
      slides[currentIndex].title = titleEl.innerText.trim();
      renderSidebar();
    });

    subtitleEl.addEventListener('input', () => {
      slides[currentIndex].subtitle = subtitleEl.innerText.trim();
      renderSidebar();
    });

    document.getElementById('addSlideBtn').addEventListener('click', addSlide);

    // Init
    loadSlide(0);
    renderSidebar();

    // Sidebar resize
    const sidebarEl = document.getElementById('slidesSidebar');
    const resizeHandle = document.getElementById('sidebarResizeHandle');
    let isResizing = false;
    let resizeStartX = 0;
    let resizeStartWidth = 0;

    resizeHandle.addEventListener('mousedown', function(e) {
      isResizing = true;
      resizeStartX = e.clientX;
      resizeStartWidth = sidebarEl.offsetWidth;
      resizeHandle.classList.add('dragging');
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
      e.preventDefault();
    });

    document.addEventListener('mousemove', function(e) {
      if (!isResizing) return;
      const dx = e.clientX - resizeStartX;
      const newWidth = Math.min(600, Math.max(120, resizeStartWidth + dx));
      sidebarEl.style.width = newWidth + 'px';
    });

    document.addEventListener('mouseup', function() {
      if (!isResizing) return;
      isResizing = false;
      resizeHandle.classList.remove('dragging');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
    });
  </script>
</body>
