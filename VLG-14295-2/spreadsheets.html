<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Яндекс Таблицы</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Unbounded:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      height: 100%;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 14px;
      background: #f4f6f8;
      color: #1a1a1a;
      overflow: hidden
    }

    /* ============================================================
       DESIGN TOKENS
       ============================================================ */
    :root {
      --header-height:      122px;
      --formula-bar-height:  28px;
      --sheets-bar-height:   30px;
      /* Orb design tokens */
      --orb-spacing-m:        4px;
      --orb-spacing-2-m:      8px;
      --orb-rounding-6-m:     12px;
      --orb-line-generiс:     rgba(181, 183, 192, 0.30);
      --orb-misc-surface-meeting: rgba(255, 255, 255, 0.18);
    }

    /* ===== App shell — CSS Grid ===== */
    #app {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows:
        var(--header-height)
        1fr
        var(--sheets-bar-height);
      height: 100vh;
      width: 100%;
    }

    /* ===== App header ===== */
    .app-header {
      grid-column: 1 / -1;
      grid-row: 1;
      background: #e8f5e9;
      border-bottom: 1px solid #c8e6c9;
      overflow: visible;
      padding: 12px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 0;
      min-height: 0;
      position: relative;
      z-index: 10;
    }
    /* Background SVG pinned to top-right of header */
    .hdr-bg {
      position: absolute;
      right: 0;
      top: 0;
      pointer-events: none;
      line-height: 0;
      z-index: 0;
    }

    /* Ensure header content sits above the background */
    .header-top,
    .header-menu,
    .header-bottom {
      position: relative;
      z-index: 1;
    }

    .header-top { z-index: 10; }

    .header-top {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .header-bottom {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      flex: 1;
      overflow: visible;
      min-width: 0;
      min-height: 32px;
      flex-shrink: 0;
    }

    .header-rect.hidden-overflow {
      display: none;
    }

    .header-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #d0d0d0;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .header-circle.logo {
      background: transparent;
      cursor: pointer;
      transition: background .15s;
      border-radius: 50%;
    }

    .header-circle.logo:hover {
      background: rgba(0, 0, 0, 0.08);
    }
    .header-top .header-circle.logo:nth-child(2):hover {
      background: transparent;
      cursor: default;
    }

    .header-menu {
      display: flex;
      align-items: center;
      gap: 0;
      flex-shrink: 0;
      margin-top: 2px;
      margin-bottom: 8px;
    }

    .header-menu-btn {
      height: 28px;
      padding: 0 8px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      color: #333;
      transition: background .15s;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
    }

    .header-menu-btn:hover {
      background: rgba(0, 0, 0, 0.08);
    }

    .header-title {
      font-family: 'Inter', 'Google Sans', sans-serif;
      font-weight: 400;
      font-size: 15px;
      color: #3d3d3d;
      margin-left: 4px;
      flex-shrink: 0;
      border-radius: 4px;
      padding: 2px 4px;
      cursor: text;
    }
    .header-title:focus {
      outline: none;
      background: rgba(0,0,0,0.05);
    }

    .header-tool-btn-sparkles {
      color: #e65100;
    }
    .header-tool-btn-sparkles:hover {
      color: #bf360c;
    }

    .header-rect {
      display: flex;
      height: 32px;
      padding: var(--orb-spacing-2-m);
      justify-content: center;
      align-items: center;
      gap: var(--orb-spacing-m);
      border-radius: var(--orb-rounding-6-m);
      border: 1px solid var(--orb-line-generiс);
      background: var(--orb-misc-surface-meeting);
      backdrop-filter: blur(2.5px);
      flex-shrink: 0;
    }

    .header-rect.header-rect-tools {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 2px;
      border-radius: 12px;
      width: fit-content;
    }

    .header-tool-btn {
      position: relative;
      width: 28px;
      height: 28px;
      min-width: 28px;
      min-height: 28px;
      flex-shrink: 0;
      padding: 0;
      border: none;
      background: transparent;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgb(0 0 0 / 75%);
    }
    .header-tool-btn::after {
      content: attr(data-tooltip);
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-top: 6px;
      padding: 4px 8px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      border-radius: 4px;
      font-size: 12px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
      z-index: 1000;
    }
    .header-tool-btn:hover {
      background: rgba(0, 0, 0, 0.06);
    }
    .header-tool-btn:hover::after {
      opacity: 1;
    }
    .header-tool-btn:active {
      background: rgba(0, 0, 0, 0.1);
    }
    .header-tool-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      pointer-events: auto;
    }
    .header-tool-btn:disabled:hover {
      background: transparent;
    }
    .header-tool-btn:disabled::after {
      display: none;
    }
    .header-tool-btn svg {
      width: 15px;
      height: 15px;
    }
    .header-tool-btn svg [stroke] {
      stroke-width: 1.5;
    }

    /* ===== Font dropdown ===== */
    .font-select-wrap {
      position: relative;
      width: 110px;
      height: 28px;
      display: flex;
      align-items: center;
      border-radius: 10px;
      transition: background .15s;
    }
    .font-select-wrap:hover {
      background: rgba(0, 0, 0, 0.06);
    }
    .font-select {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      border: none;
      padding: 0 22px 0 8px;
      font-family: inherit;
      font-size: 14px;
      color: rgb(0 0 0 / 75%);
      cursor: pointer;
      outline: none;
    }
    .font-select-chevron {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: rgb(0 0 0 / 75%);
      display: flex;
    }

    /* ===== Font size control ===== */
    .font-size-wrap {
      display: flex;
      align-items: center;
      gap: 2px;
      height: 28px;
      border-radius: 10px;
    }
    .font-size-value {
      font-size: 14px;
      color: rgb(0 0 0 / 75%);
      min-width: 16px;
      text-align: center;
      user-select: none;
      cursor: default;
    }
    .font-size-wrap .header-tool-btn svg {
      width: 12px;
      height: 12px;
    }

    /* ===== Workspace ===== */
    .app-workspace {
      grid-column: 1;
      grid-row: 2;
      display: flex;
      flex-direction: row;
      overflow: hidden;
      min-width: 0;
    }
    .workspace-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
      position: relative;
    }

    /* ===== Cell selection ===== */
    .grid td.selected {
      outline: 2px solid #4caf50;
      outline-offset: -2px;
      background: transparent !important
    }
    .grid thead th.col-highlight {
      background: #e8f5e9 !important;
      color: rgba(0, 0, 0, 0.9)
    }
    .grid .rn.row-highlight {
      background: #e8f5e9 !important;
      color: rgba(0, 0, 0, 0.9)
    }

    /* ===== Formula bar ===== */
    .formula-bars {
      flex-shrink: 0;
    }
    .formula-bar {
      display: flex;
      align-items: center;
      border-bottom: 1px solid #e0e0e0;
      flex: 0 0 var(--formula-bar-height);
      background: #fff;
    }
    .fb-variant {
      width: 64px;
      border-right: 1px solid #e0e0e0;
      padding: 0 8px;
      font-size: 11px;
      color: #999;
      display: flex;
      align-items: center;
      height: 100%;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .fb-cell {
      width: 60px;
      border-right: 1px solid #e0e0e0;
      padding: 0 8px;
      font-size: 12px;
      color: #555;
      display: flex;
      align-items: center;
      height: 100%
    }

    .fb-fx {
      width: 28px;
      border-right: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #888;
      font-style: italic;
      height: 100%
    }

    .fb-input {
      flex: 1;
      padding: 0 8px;
      font-size: 12px;
      color: #333;
      height: 100%;
      border: none;
      outline: none;
      font-family: Arial, sans-serif;
      white-space: nowrap;
      overflow-x: auto;
      overflow-y: hidden;
      cursor: text;
      line-height: var(--formula-bar-height);
    }
    .fb-input::-webkit-scrollbar { height: 0; }
    .fb-input:empty::before {
      content: attr(data-placeholder);
      color: #bbb;
      pointer-events: none;
    }
    .fb-input:focus { outline: none; }
    .fb-input .fxeq { color: #888; }
    .fb-ref { font-weight: 600; }

    /* ===== Grid scroll ===== */
    .grid-scroll {
      flex: 1;
      overflow: auto;
      min-height: 0;
      position: relative;
    }
    .grid {
      border-collapse: collapse;
      font-size: 13px;
      table-layout: fixed
    }

    .grid th,
    .grid td {
      border: 1px solid #e0e0e0;
      padding: 2px 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .grid thead th {
      background: #fff;
      color: #333;
      font-weight: 400;
      text-align: center;
      height: 22px;
      position: sticky;
      top: 0;
      z-index: 3;
      font-size: 12px
    }

    .grid thead th:first-child {
      z-index: 4
    }

    .grid .rn {
      background: #fff;
      color: #333;
      text-align: center;
      width: 40px;
      min-width: 40px;
      font-size: 12px;
      position: sticky;
      left: 0;
      z-index: 2
    }

    .grid td {
      background: #fff;
      color: #333;
      height: 22px;
      min-width: 80px
    }

    .grid td.num {
      text-align: right;
      font-variant-numeric: tabular-nums
    }

    /* ===== Sheets bar ===== */
    .sheets-bar {
      grid-column: 1 / -1;
      grid-row: 3;
      display: flex;
      align-items: center;
      border-top: 1px solid #e0e0e0;
      background: #fff;
      padding: 0 8px;
      overflow: hidden;
    }

    .tab-btn {
      padding: 5px 16px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: transparent;
      color: #555;
      border-bottom: 2px solid transparent;
      transition: all .15s;
      white-space: nowrap
    }

    .tab-btn.active {
      background: #fff;
      color: #2e7d32;
      border-bottom-color: #4caf50;
      font-weight: 700
    }

    .tab-btn:hover:not(.active) {
      background: #eee
    }

    .tab-add {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      color: #bbb;
      margin-left: 4px;
      padding: 2px 6px
    }

    .tab-nav {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 13px;
      color: #999;
      padding: 4px 6px
    }

    /* ===== Header top action buttons ===== */
    .header-top-icon-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      border-radius: 10px;
      cursor: pointer;
      color: rgba(0, 0, 0, 0.75);
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .header-top-icon-btn:hover {
      background: rgba(0, 0, 0, 0.06);
    }
    .header-top-icon-btn::after {
      content: attr(data-tooltip);
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-top: 6px;
      padding: 4px 8px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      border-radius: 4px;
      font-size: 12px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
      z-index: 1000;
    }
    .header-top-icon-btn:hover::after {
      opacity: 1;
    }
    .header-share-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 0 10px 0 8px;
      height: 28px;
      border: none;
      background: transparent;
      border-radius: 10px;
      cursor: pointer;
      color: rgba(0, 0, 0, 0.75);
      font-size: 14px;
      font-family: inherit;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .header-share-btn:hover {
      background: rgba(0, 0, 0, 0.06);
    }

    /* ===== Split button ===== */
    .split-btn {
      display: inline-flex;
      align-items: center;
      gap: 1px;
    }
    .split-btn-main {
      border-radius: 10px 0 0 10px !important;
    }
    .split-btn-arrow {
      width: 16px !important;
      min-width: 16px !important;
      border-radius: 0 10px 10px 0 !important;
      padding: 0 !important;
      color: rgb(0 0 0 / 75%);
    }
    .split-btn-arrow svg {
      width: 12px;
      height: 12px;
    }
    .split-btn:hover .split-btn-main,
    .split-btn:hover .split-btn-arrow {
      background: rgba(0, 0, 0, 0.06);
    }
    .split-btn-menu {
      position: fixed;
      display: none;
      flex-direction: column;
      background: #fff;
      border: 1px solid rgba(181, 183, 192, 0.4);
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      z-index: 2000;
      min-width: 160px;
      padding: 4px;
    }
    .split-btn-menu.open {
      display: flex;
    }
    .split-btn-menu-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      background: none;
      border: none;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      font-size: 13px;
      color: rgba(0, 0, 0, 0.8);
      border-radius: 7px;
      width: 100%;
    }
    .split-btn-menu-item:hover {
      background: rgba(0, 0, 0, 0.05);
    }
    .split-btn-color-dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      border: 1px solid rgba(0,0,0,0.15);
      flex-shrink: 0;
    }
  </style>
</head>

        if (!rect) return;
        // Variant 1 — border only
        if (!_fxSvgRects[i]) { const el = fxMakeSvgRect('none', '0'); selSvgEl.appendChild(el); _fxSvgRects.push(el); }
        const sr = _fxSvgRects[i];
        sr.setAttribute('stroke', color);
        sr.setAttribute('x', rect.x+1); sr.setAttribute('y', rect.y+1);
        sr.setAttribute('width', rect.w-2); sr.setAttribute('height', rect.h-2);
        sr.style.display = 'block';
        // Variant 2 — fill + border
        if (!_fxSvgFillRects[i]) { const el = fxMakeSvgRect('none', '0.2'); selSvgEl.appendChild(el); _fxSvgFillRects.push(el); }
        const sf = _fxSvgFillRects[i];
        sf.setAttribute('stroke', color); sf.setAttribute('fill', color);
        sf.setAttribute('x', rect.x+1); sf.setAttribute('y', rect.y+1);
        sf.setAttribute('width', rect.w-2); sf.setAttribute('height', rect.h-2);
        sf.style.display = fxVariant === 2 ? 'block' : 'none';
      });
    }
    let _fbLastPlain = '';
    let _fbComposing = false;

    /* ====== FORMULA CELL PICK ====== */
    let fxInputMode = false;
    let fxVariant = 1;         // which formula bar is active (1 or 2)
    let fxPendingRefStart = null;
    let fxPendingRefEnd = null;
    let fxPickDragging = false;
    let fxPickAnchor = null;

    function fxCellRef(r, c) { return String.fromCharCode(65 + c) + (r + 1); }
    function fxRangeRef(r1, c1, r2, c2) {
      const a = fxCellRef(Math.min(r1,r2), Math.min(c1,c2));
      const b = fxCellRef(Math.max(r1,r2), Math.max(c1,c2));
      return a === b ? a : a + ':' + b;
    }
    function fxGetCursorOffset(el) {
      const sel = window.getSelection();
      if (!sel?.rangeCount || !el.contains(sel.anchorNode)) return (el.innerText || '').length;
      const r = document.createRange();
      r.selectNodeContents(el);
      r.setEnd(sel.getRangeAt(0).startContainer, sel.getRangeAt(0).startOffset);
      return r.toString().length;
    }
    function fxActiveEl() { return document.getElementById(fxVariant === 2 ? 'fbInput2' : 'fbInput'); }
    function fxOtherEl()  { return document.getElementById(fxVariant === 2 ? 'fbInput' : 'fbInput2'); }

    function fxInsertRef(refText) {
      const el = fxActiveEl();
      if (!el) return;
      let plain = (el.innerText || '').replace(/\n/g, '');
      if (fxPendingRefStart !== null) {
        plain = plain.slice(0, fxPendingRefStart) + refText + plain.slice(fxPendingRefEnd);
        fxPendingRefEnd = fxPendingRefStart + refText.length;
      } else {
        const cur = fxGetCursorOffset(el);
        plain = plain.slice(0, cur) + refText + plain.slice(cur);
        fxPendingRefStart = cur;
        fxPendingRefEnd = cur + refText.length;
      }
      _fbLastPlain = '';
      _fbLastPlain = plain;
      el.innerHTML = fxBuildHTML(plain, fxVariant === 2);
      fxApplyBothBars(plain, el);
      fxRestoreCursor(el, fxPendingRefEnd);
      if (plain.startsWith('=')) fxHighlightCells(fxFindRefs(plain.slice(1)), plain.slice(1));
      document.querySelectorAll('.fb-cell').forEach(c => { c.textContent = refText; });
    }
    function fxEnterMode(v) { fxInputMode = true; fxVariant = v; }
    function fxExitMode() {
      fxInputMode = false;
      fxPendingRefStart = null; fxPendingRefEnd = null;
      fxPickDragging = false; fxPickAnchor = null;
      fxHighlightCells([], '');
    }
    function fbEditorRecolor(el, v) {
      if (!el) return;
      const plain = (el.innerText || '').replace(/\n/g, '');
      if (plain === _fbLastPlain && v === fxVariant) return;
      _fbLastPlain = plain; fxVariant = v;
      const offset = fxSaveCursor(el);
      el.innerHTML = fxBuildHTML(plain, v === 2);
      fxApplyBothBars(plain, el);
      fxRestoreCursor(el, offset);
      if (plain.startsWith('=')) fxHighlightCells(fxFindRefs(plain.slice(1)), plain.slice(1));
      else fxHighlightCells([], '');
    }
    function fbEditorSetValue(plain) {
      const s = String(plain);
      if (s === _fbLastPlain) return;
      _fbLastPlain = s;
      const el1 = document.getElementById('fbInput'), el2 = document.getElementById('fbInput2');
      if (el1) el1.innerHTML = fxBuildHTML(s, false);
      if (el2) el2.innerHTML = fxBuildHTML(s, true);
      fxHighlightCells([], '');
    }
    function initFormulaEditor() {
      [
        { id: 'fbInput',  v: 1 },
        { id: 'fbInput2', v: 2 },
      ].forEach(({ id, v }) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('focus', () => {
          fxVariant = v;
          const plain = (el.innerText || '').replace(/\n/g, '');
          if (plain.startsWith('=')) fxEnterMode(v);
          // re-apply highlights for this variant
          if (plain.startsWith('=')) fxHighlightCells(fxFindRefs(plain.slice(1)), plain.slice(1));
        });
        el.addEventListener('input', () => {
          if (_fbComposing) return;
          fxPendingRefStart = null; fxPendingRefEnd = null;
          fbEditorRecolor(el, v);
          const plain = (el.innerText || '').replace(/\n/g, '');
          if (plain.startsWith('=')) fxEnterMode(v); else fxExitMode();
        });
        el.addEventListener('paste', e => {
          e.preventDefault();
          const text = (e.clipboardData.getData('text/plain') || '').replace(/\n/g, '');
          document.execCommand('insertText', false, text);
        });
        el.addEventListener('keydown', e => {
          if (e.key === 'Enter') { e.preventDefault(); fxExitMode(); el.blur(); }
          if (e.key === 'Escape') { e.preventDefault(); fxExitMode(); el.blur(); }
        });
        el.addEventListener('compositionstart', () => { _fbComposing = true; });
        el.addEventListener('compositionend', () => { _fbComposing = false; fbEditorRecolor(el, v); });
        el.addEventListener('blur', () => { if (!fxPickDragging) fxExitMode(); });
      });
    }

    /* ====== INIT ====== */
    renderSheet(); initFormulaEditor();
  </script>
</body>

</html>
