<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Яндекс Документы</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Unbounded:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      height: 100%;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 14px;
      background: #f4f6f8;
      color: #1a1a1a;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    :root {
      --orb-spacing-m:        4px;
      --orb-spacing-2-m:      8px;
      --orb-rounding-6-m:     12px;
      --orb-line-generiс:     rgba(181, 183, 192, 0.30);
      --orb-misc-surface-meeting: rgba(255, 255, 255, 0.18);
    }

    /* ===== App header ===== */
    .app-header {
      background: #e3f2fd;
      overflow: visible;
      padding: 12px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 0;
      min-height: 0;
      position: relative;
      z-index: 10;
    }

    .hdr-bg {
      position: absolute;
      right: 0;
      top: 0;
      pointer-events: none;
      line-height: 0;
      z-index: 0;
    }

    .header-top,
    .header-menu,
    .header-bottom {
      position: relative;
      z-index: 1;
    }

    .header-top {
      z-index: 10;
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .header-bottom {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      flex: 1;
      overflow: visible;
      min-width: 0;
      min-height: 32px;
      flex-shrink: 0;
    }

    .header-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #d0d0d0;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .header-circle.logo {
      background: transparent;
      cursor: pointer;
      transition: background .15s;
      border-radius: 50%;
    }

    .header-circle.logo:hover {
      background: rgba(0, 0, 0, 0.08);
    }

    .header-top .header-circle.logo:nth-child(2):hover {
      background: transparent;
      cursor: default;
    }

    .header-menu {
      display: flex;
      align-items: center;
      gap: 0;
      flex-shrink: 0;
      margin-top: 2px;
      margin-bottom: 8px;
    }

    .header-menu-btn {
      height: 28px;
      padding: 0 8px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      color: #333;
      transition: background .15s;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
    }

    .header-menu-btn:hover {
      background: rgba(0, 0, 0, 0.08);
    }

    .header-title {
      font-family: 'Inter', 'Google Sans', sans-serif;
      font-weight: 400;
      font-size: 15px;
      color: #3d3d3d;
      margin-left: 4px;
      flex-shrink: 0;
      border-radius: 4px;
      padding: 2px 4px;
      cursor: text;
    }
    .header-title:focus {
      outline: none;
      background: rgba(0,0,0,0.05);
    }

    .header-rect {
      display: flex;
      height: 32px;
      padding: var(--orb-spacing-2-m);
      justify-content: center;
      align-items: center;
      gap: var(--orb-spacing-m);
      border-radius: var(--orb-rounding-6-m);
      border: 1px solid var(--orb-line-generiс);
      background: var(--orb-misc-surface-meeting);
      backdrop-filter: blur(2.5px);
      flex-shrink: 0;
    }

    .header-rect.header-rect-tools {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 2px;
      border-radius: 12px;
      width: fit-content;
    }

    .header-tool-btn {
      position: relative;
      width: 28px;
      height: 28px;
      min-width: 28px;
      min-height: 28px;
      flex-shrink: 0;
      padding: 0;
      border: none;
      background: transparent;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgb(0 0 0 / 75%);
    }
    .header-tool-btn::after {
      content: attr(data-tooltip);
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-top: 6px;
      padding: 4px 8px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      border-radius: 4px;
      font-size: 12px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
      z-index: 1000;
    }
    .header-tool-btn:hover {
      background: rgba(0, 0, 0, 0.06);
    }
    .header-tool-btn:hover::after {
      opacity: 1;
    }
    .header-tool-btn:active {
      background: rgba(0, 0, 0, 0.1);
    }
    .header-tool-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      pointer-events: auto;
    }
    .header-tool-btn:disabled:hover {
      background: transparent;
    }
    .header-tool-btn:disabled::after {
      display: none;
    }
    .header-tool-btn svg {
      width: 15px;
      height: 15px;
    }
    .header-tool-btn svg [stroke] {
      stroke-width: 1.5;
    }

    /* ===== Font dropdown ===== */
    .font-select-wrap {
      position: relative;
      width: 110px;
      height: 28px;
      display: flex;
      align-items: center;
      border-radius: 10px;
      transition: background .15s;
    }
    .font-select-wrap:hover {
      background: rgba(0, 0, 0, 0.06);
    }
    .font-select {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      border: none;
      padding: 0 22px 0 8px;
      font-family: inherit;
      font-size: 14px;
      color: rgb(0 0 0 / 75%);
      cursor: pointer;
      outline: none;
    }
    .font-select-chevron {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: rgb(0 0 0 / 75%);
      display: flex;
    }

    /* ===== Font size control ===== */
    .font-size-wrap {
      display: flex;
      align-items: center;
      gap: 2px;
      height: 28px;
      border-radius: 10px;
    }
    .font-size-value {
      font-size: 14px;
      color: rgb(0 0 0 / 75%);
      min-width: 16px;
      text-align: center;
      user-select: none;
      cursor: default;
    }
    .font-size-wrap .header-tool-btn svg {
      width: 12px;
      height: 12px;
    }

    /* ===== Header top action buttons ===== */
    .header-top-icon-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      border-radius: 10px;
      cursor: pointer;
      color: rgba(0, 0, 0, 0.75);
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .header-top-icon-btn:hover {
      background: rgba(0, 0, 0, 0.06);
    }
    .header-top-icon-btn::after {
      content: attr(data-tooltip);
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-top: 6px;
      padding: 4px 8px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      border-radius: 4px;
      font-size: 12px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
      z-index: 1000;
    }
    .header-top-icon-btn:hover::after {
      opacity: 1;
    }
    .header-share-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 0 10px 0 8px;
      height: 28px;
      border: none;
      background: transparent;
      border-radius: 10px;
      cursor: pointer;
      color: rgba(0, 0, 0, 0.75);
      font-size: 14px;
      font-family: inherit;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .header-share-btn:hover {
      background: rgba(0, 0, 0, 0.06);
    }

    /* ===== Split button ===== */
    .split-btn {
      display: inline-flex;
      align-items: center;
      gap: 1px;
    }
    .split-btn-main {
      border-radius: 10px 0 0 10px !important;
    }
    .split-btn-arrow {
      width: 16px !important;
      min-width: 16px !important;
      border-radius: 0 10px 10px 0 !important;
      padding: 0 !important;
      color: rgb(0 0 0 / 75%);
    }
    .split-btn-arrow svg {
      width: 12px;
      height: 12px;
    }
    .split-btn:hover .split-btn-main,
    .split-btn:hover .split-btn-arrow {
      background: rgba(0, 0, 0, 0.06);
    }
    .split-btn-menu {
      position: fixed;
      display: none;
      flex-direction: column;
      background: #fff;
      border: 1px solid rgba(181, 183, 192, 0.4);
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      z-index: 2000;
      min-width: 160px;
      padding: 4px;
    }
    .split-btn-menu.open {
      display: flex;
    }
    .split-btn-menu-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      background: none;
      border: none;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      font-size: 13px;
      color: rgba(0, 0, 0, 0.8);
      border-radius: 7px;
      width: 100%;
    }
    .split-btn-menu-item:hover {
      background: rgba(0, 0, 0, 0.05);
    }
    .split-btn-color-dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      border: 1px solid rgba(0,0,0,0.15);
      flex-shrink: 0;
    }

    /* ===== Document workspace ===== */
    .doc-main {
      flex: 1;
      overflow: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 24px 64px;
      background: #fafafa;
      min-height: 0;
    }

    .doc-sheet {
      box-sizing: border-box;
      width: 794px;
      min-height: 1123px;
      background: #fff;
      border: 1px solid #e0e0e0;
      box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 2px 8px rgba(0,0,0,.06);
      padding: 96px 96px;
      font-family: 'Inter', Arial, sans-serif;
      font-size: 11pt;
      line-height: 1.6;
      color: #1d1b20;
      outline: none;
      caret-color: #444;
    }

    .doc-sheet:focus { outline: none; }

    .doc-sheet p { margin: 0 0 0.5em; }

    .doc-sheet h1 { font-size: 2em; font-weight: 700; margin: 0 0 0.5em; }
    .doc-sheet h2 { font-size: 1.5em; font-weight: 600; margin: 0 0 0.5em; }
    .doc-sheet h3 { font-size: 1.2em; font-weight: 600; margin: 0 0 0.5em; }
  </style>
</head>
