<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Яндекс Таблицы</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Unbounded:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      height: 100%;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 14px;
      background: #f4f6f8;
      color: #1a1a1a;
      overflow: hidden
    }

    /* ============================================================
       DESIGN TOKENS
       ============================================================ */
    :root {
      --header-height:      122px;
      --formula-bar-height:  28px;
      --sheets-bar-height:   30px;
      --sidebar-width:       420px;
      --sidebar-min-width:   300px;
      --sidebar-max-width:   640px;
      --resize-handle-size:    4px;

      /* Orb design tokens */
      --orb-spacing-m:        4px;
      --orb-spacing-2-m:      8px;
      --orb-rounding-6-m:     12px;
      --orb-line-generiс:     rgba(181, 183, 192, 0.30);
      --orb-misc-surface-meeting: rgba(255, 255, 255, 0.18);
    }

    /* ===== App shell — CSS Grid ===== */
    #app {
      display: grid;
      grid-template-columns: 1fr var(--sidebar-width);
      grid-template-rows:
        var(--header-height)
        1fr
        var(--sheets-bar-height);
      height: 100vh;
      width: 100%;
      transition: grid-template-columns .2s ease;
    }

    #app.sidebar-hidden {
      grid-template-columns: 1fr 0;
    }

    /* ===== App header ===== */
    .app-header {
      grid-column: 1 / -1;
      grid-row: 1;
      background: #e8f5e9;
      border-bottom: 1px solid #c8e6c9;
      overflow: visible;
      padding: 12px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 0;
      min-height: 0;
      position: relative;
      z-index: 10;
    }

    /* Background SVG pinned to top-right of header */
    .hdr-bg {
      position: absolute;
      right: 0;
      top: 0;
      pointer-events: none;
      line-height: 0;
      z-index: 0;
    }

    /* Ensure header content sits above the background */
    .header-top,
    .header-menu,
    .header-bottom {
      position: relative;
      z-index: 1;
    }

    .header-top { z-index: 10; }

    .header-top {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .header-bottom {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      flex: 1;
      overflow: visible;
      min-width: 0;
      min-height: 32px;
      flex-shrink: 0;
    }

    .header-rect.hidden-overflow {
      display: none;
    }

    .header-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #d0d0d0;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .header-circle.logo {
      background: transparent;
      cursor: pointer;
      transition: background .15s;
      border-radius: 50%;
    }

    .header-circle.logo:hover {
      background: rgba(0, 0, 0, 0.08);
    }
    .header-top .header-circle.logo:nth-child(2):hover {
      background: transparent;
      cursor: default;
    }

    .header-menu {
      display: flex;
      align-items: center;
      gap: 0;
      flex-shrink: 0;
      margin-top: 2px;
      margin-bottom: 8px;
    }

    .header-menu-btn {
      height: 28px;
      padding: 0 8px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      color: #333;
      transition: background .15s;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
    }

    .header-menu-btn:hover {
      background: rgba(0, 0, 0, 0.08);
    }

    .header-title {
      font-family: 'Inter', 'Google Sans', sans-serif;
      font-weight: 400;
      font-size: 15px;
      color: #3d3d3d;
      margin-left: 4px;
      flex-shrink: 0;
      border-radius: 4px;
      padding: 2px 4px;
      cursor: text;
    }
    .header-title:focus {
      outline: none;
      background: rgba(0,0,0,0.05);
    }

    .header-tool-btn-sparkles {
      color: #e65100;
    }
    .header-tool-btn-sparkles:hover {
      color: #bf360c;
    }

    .header-rect {
      display: flex;
      height: 32px;
      padding: var(--orb-spacing-2-m);
      justify-content: center;
      align-items: center;
      gap: var(--orb-spacing-m);
      border-radius: var(--orb-rounding-6-m);
      border: 1px solid var(--orb-line-generiс);
      background: var(--orb-misc-surface-meeting);
      backdrop-filter: blur(2.5px);
      flex-shrink: 0;
    }

    .header-rect.header-rect-tools {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 2px;
      border-radius: 12px;
      width: fit-content;
    }

    .header-tool-btn {
      position: relative;
      width: 28px;
      height: 28px;
      min-width: 28px;
      min-height: 28px;
      flex-shrink: 0;
      padding: 0;
      border: none;
      background: transparent;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgb(0 0 0 / 75%);
    }
    .header-tool-btn::after {
      content: attr(data-tooltip);
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-top: 6px;
      padding: 4px 8px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      border-radius: 4px;
      font-size: 12px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
      z-index: 1000;
    }
    .header-tool-btn:hover {
      background: rgba(0, 0, 0, 0.06);
    }
    .header-tool-btn:hover::after {
      opacity: 1;
    }
    .header-tool-btn:active {
      background: rgba(0, 0, 0, 0.1);
    }
    .header-tool-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      pointer-events: auto;
    }
    .header-tool-btn:disabled:hover {
      background: transparent;
    }
    .header-tool-btn:disabled::after {
      display: none;
    }
    .header-tool-btn svg {
      width: 15px;
      height: 15px;
    }
    .header-tool-btn svg [stroke] {
      stroke-width: 1.5;
    }

    /* ===== Font dropdown ===== */
    .font-select-wrap {
      position: relative;
      width: 110px;
      height: 28px;
      display: flex;
      align-items: center;
      border-radius: 10px;
      transition: background .15s;
    }
    .font-select-wrap:hover {
      background: rgba(0, 0, 0, 0.06);
    }
    .font-select {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      border: none;
      padding: 0 22px 0 8px;
      font-family: inherit;
      font-size: 14px;
      color: rgb(0 0 0 / 75%);
      cursor: pointer;
      outline: none;
    }
    .font-select-chevron {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: rgb(0 0 0 / 75%);
      display: flex;
    }

    /* ===== Font size control ===== */
    .font-size-wrap {
      display: flex;
      align-items: center;
      gap: 2px;
      height: 28px;
      border-radius: 10px;
    }
    .font-size-value {
      font-size: 14px;
      color: rgb(0 0 0 / 75%);
      min-width: 16px;
      text-align: center;
      user-select: none;
      cursor: default;
    }
    .font-size-wrap .header-tool-btn svg {
      width: 12px;
      height: 12px;
    }

    /* ===== Workspace ===== */
    .app-workspace {
      grid-column: 1;
      grid-row: 2;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    /* ===== Zone highlight during drag ===== */
    .zone-drop.drag-ready {
      border-color: #81c784 !important;
      background: #f1f8f1 !important
    }

    /* ===== Cell selection ===== */
    .grid td.selected {
      outline: 2px solid #4caf50;
      outline-offset: -2px;
      background: transparent !important
    }
    .grid thead th.col-highlight {
      background: #e8f5e9 !important;
      color: rgba(0, 0, 0, 0.9)
    }
    .grid .rn.row-highlight {
      background: #e8f5e9 !important;
      color: rgba(0, 0, 0, 0.9)
    }

    /* ===== Filter pill ===== */
    .filter-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #fff;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      padding: 5px 10px;
      margin-bottom: 5px;
      font-size: 13px;
      color: #333;
      user-select: none;
      transition: border-color .15s, box-shadow .12s
    }
    .filter-pill:hover { border-color: #4caf50; box-shadow: 0 1px 4px rgba(76,175,80,.12) }
    .filter-pill .fp-handle { color: #ccc; font-size: 12px; cursor: grab; flex-shrink: 0 }
    .filter-pill .fp-badge { font-size: 10px; padding: 1px 5px; border-radius: 3px; font-weight: 700; flex-shrink: 0; line-height: 1.3 }
    .filter-pill .fp-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
    .filter-pill .fp-count { font-size: 11px; color: #777; white-space: nowrap; flex-shrink: 0 }
    .filter-pill .fp-chevron { font-size: 11px; color: #aaa; cursor: pointer; flex-shrink: 0; transition: color .15s }
    .filter-pill .fp-chevron:hover { color: #4caf50 }
    .filter-pill .fp-rm { background: none; border: none; cursor: pointer; font-size: 14px; color: #ccc; padding: 0 2px; line-height: 1; transition: color .15s }
    .filter-pill .fp-rm:hover { color: #e53935 }

    /* Filter popup */
    .filter-popup {
      position: fixed;
      z-index: 1001;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      box-shadow: 0 6px 24px rgba(0,0,0,.14);
      width: 220px;
      padding: 12px 14px 14px;
      font-size: 13px
    }
    .fpp-title { font-weight: 700; font-size: 13px; margin-bottom: 8px; color: #111 }
    .fpp-search { display: flex; align-items: center; gap: 6px; background: #f7f7f7; border: 1px solid #e0e0e0; border-radius: 6px; padding: 5px 8px; margin-bottom: 8px }
    .fpp-search input { border: none; background: none; outline: none; font-family: inherit; font-size: 12px; color: #333; width: 100% }
    .fpp-all { display: flex; align-items: center; gap: 8px; padding: 4px 2px 6px; border-bottom: 1px solid #f0f0f0; margin-bottom: 6px; cursor: pointer; font-weight: 700; font-size: 12px; color: #333 }
    .fpp-all input[type=checkbox],
    .fpp-val input[type=checkbox] {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border: 2px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
      flex-shrink: 0;
      background: #fff;
      transition: all .15s;
      position: relative
    }
    .fpp-all input[type=checkbox]:checked,
    .fpp-val input[type=checkbox]:checked {
      background: #4caf50;
      border-color: #4caf50
    }
    .fpp-all input[type=checkbox]:checked::after,
    .fpp-val input[type=checkbox]:checked::after {
      content: '';
      position: absolute;
      left: 3px;
      top: 0px;
      width: 6px;
      height: 10px;
      border: 2px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg)
    }
    .fpp-values { max-height: 160px; overflow-y: auto; display: flex; flex-direction: column; gap: 1px }
    .fpp-val { display: flex; align-items: center; gap: 8px; padding: 4px 2px; border-radius: 4px; cursor: pointer; font-size: 12px; color: #333; transition: background .1s }
    .fpp-val:hover { background: #f5f5f5 }
    .fpp-val input { accent-color: #4caf50; cursor: pointer; flex-shrink: 0 }
    .fpp-sort { margin-bottom: 10px }
    .fpp-sort-label { font-size: 11px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: .4px; display: block; margin-bottom: 5px }
    .fpp-sort-btns { display: flex; gap: 5px }
    .fpp-sort-btn { flex: 1; padding: 5px 4px; border: 1.5px solid #e0e0e0; border-radius: 6px; font-size: 11px; font-family: inherit; cursor: pointer; background: #fff; color: #555; transition: all .15s; text-align: center }
    .fpp-sort-btn:hover { border-color: #4caf50; color: #2e7d32 }
    .fpp-sort-btn.active { background: #e8f5e9; border-color: #4caf50; color: #2e7d32; font-weight: 700 }
    .fpp-actions { display: flex; gap: 6px; margin-top: 10px }
    .fpp-btn { flex: 1; padding: 6px 0; border-radius: 6px; border: 1px solid #e0e0e0; font-size: 12px; font-family: inherit; cursor: pointer; background: #fff; color: #333; transition: all .15s }
    .fpp-btn.primary { background: #4caf50; border-color: #4caf50; color: #fff; font-weight: 700 }
    .fpp-btn:hover:not(.primary) { background: #f5f5f5 }
    .fpp-btn.primary:hover { background: #43a047 }



    /* ===== Formula bar ===== */
    .formula-bar {
      display: flex;
      align-items: center;
      border-bottom: 1px solid #e0e0e0;
      flex: 0 0 var(--formula-bar-height);
      background: #fff;
    }

    .fb-cell {
      width: 60px;
      border-right: 1px solid #e0e0e0;
      padding: 0 8px;
      font-size: 12px;
      color: #555;
      display: flex;
      align-items: center;
      height: 100%
    }

    .fb-fx {
      width: 28px;
      border-right: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #888;
      font-style: italic;
      height: 100%
    }

    .fb-input {
      flex: 1;
      padding: 0 8px;
      font-size: 12px;
      color: #333;
      height: 100%;
      border: none;
      outline: none;
      font-family: inherit
    }

    /* ===== Grid scroll ===== */
    .grid-scroll {
      flex: 1;
      overflow: auto;
      min-height: 0;
    }

    .grid {
      border-collapse: collapse;
      font-size: 13px;
      table-layout: fixed
    }

    .grid th,
    .grid td {
      border: 1px solid #e0e0e0;
      padding: 2px 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .grid thead th {
      background: #fff;
      color: #333;
      font-weight: 400;
      text-align: center;
      height: 22px;
      position: sticky;
      top: 0;
      z-index: 3;
      font-size: 12px
    }

    .grid thead th:first-child {
      z-index: 4
    }

    .grid .rn {
      background: #fff;
      color: #333;
      text-align: center;
      width: 40px;
      min-width: 40px;
      font-size: 12px;
      position: sticky;
      left: 0;
      z-index: 2
    }

    .grid td {
      background: #fff;
      color: #333;
      height: 22px;
      min-width: 80px
    }

    .grid td.num {
      text-align: right;
      font-variant-numeric: tabular-nums
    }

    .pivot-sheet .grid td.pv-header {
      background: #f0f7f0;
      font-weight: 700;
      color: #2e7d32
    }

    .pivot-sheet .grid td.pv-total {
      background: #f0f7f0;
      font-weight: 700
    }

    /* ===== Sheets bar ===== */
    .sheets-bar {
      grid-column: 1 / -1;
      grid-row: 3;
      display: flex;
      align-items: center;
      border-top: 1px solid #e0e0e0;
      background: #fff;
      padding: 0 8px;
      overflow: hidden;
    }

    .tab-btn {
      padding: 5px 16px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: transparent;
      color: #555;
      border-bottom: 2px solid transparent;
      transition: all .15s;
      white-space: nowrap
    }

    .tab-btn.active {
      background: #fff;
      color: #2e7d32;
      border-bottom-color: #4caf50;
      font-weight: 700
    }

    .tab-btn:hover:not(.active) {
      background: #eee
    }

    .tab-add {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      color: #bbb;
      margin-left: 4px;
      padding: 2px 6px
    }

    .tab-nav {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 13px;
      color: #999;
      padding: 4px 6px
    }

    /* ===== Sidebar ===== */
    .app-sidebar {
      grid-column: 2;
      grid-row: 2;
      position: relative;
      background: #fff;
      border-left: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #app.sidebar-hidden .app-sidebar {
      pointer-events: none;
    }

    /* Resize handle — left edge of sidebar */
    .sidebar-resize-handle {
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--resize-handle-size);
      cursor: col-resize;
      z-index: 10;
      transition: background .15s;
    }

    .sidebar-resize-handle:hover,
    .sidebar-resize-handle.is-dragging {
      background: rgba(76, 175, 80, 0.5);
    }

    #app.sidebar-hidden .sidebar-resize-handle {
      display: none;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px 12px;
      border-bottom: 1px solid #ececec
    }

    .sidebar-header h2 {
      font-size: 17px;
      font-weight: 700
    }

    .sidebar-close {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      color: #888;
      padding: 4px;
      border-radius: 4px;
      line-height: 1
    }

    .sidebar-close:hover {
      background: #f0f0f0;
      color: #333
    }

    .data-range {
      padding: 10px 20px 12px
    }

    .data-range-label {
      font-size: 13px;
      font-weight: 700;
      color: #333;
      margin-bottom: 6px
    }

    .data-range-box {
      background: #f7f7f7;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
      color: #555;
      display: flex;
      align-items: center;
      justify-content: space-between
    }

    /* ===== Sidebar body (zones left, fields right) ===== */
    .sidebar-scroll {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 20px
    }

    .sidebar-body {
      display: flex;
      gap: 0;
      min-height: 0
    }

    .zones-col {
      flex: 1.1;
      padding: 8px 14px 8px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px
    }

    .fields-col {
      flex: 0.9;
      padding: 8px 16px 8px 0
    }

    /* ===== Zone blocks ===== */
    .zone-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px
    }

    .zone-title {
      font-size: 14px;
      font-weight: 700;
      color: #222
    }

    .zone-add {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      color: #bbb;
      transition: color .15s;
      line-height: 1
    }

    .zone-add:hover {
      color: #4caf50
    }

    /* Drop area — empty state */
    .zone-drop {
      min-height: 80px;
      background: #f8f9f8;
      border: 1.5px dashed #ddd;
      border-radius: 10px;
      padding: 8px;
      transition: background .15s, border-color .15s
    }

    .zone-drop.drag-over {
      background: #e8f5e9;
      border-color: #81c784
    }

    .zone-drop.has-items {
      min-height: 0;
      background: #f8f9f8;
      border-style: dashed;
      padding: 6px 8px
    }

    .zone-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 10px;
      color: #bbb;
      text-align: center
    }

    .zone-empty-icon {
      width: 48px;
      height: 48px;
      margin-bottom: 6px;
      opacity: .25
    }

    .zone-empty-icon svg {
      width: 100%;
      height: 100%
    }

    .zone-empty-text {
      font-size: 12px;
      line-height: 1.4;
      color: #bbb
    }

    /* ===== Pills (Строки/Столбцы) ===== */
    .pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #3d8c40;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      margin-bottom: 4px;
      cursor: grab;
      font-size: 13px;
      color: #fff;
      user-select: none;
      transition: box-shadow .12s, opacity .15s
    }

    .pill:active {
      cursor: grabbing
    }

    .pill:hover {
      box-shadow: 0 1px 6px rgba(61, 140, 64, .25)
    }

    .pill.dragging {
      opacity: .35
    }

    .pill .p-handle {
      font-size: 12px;
      color: rgba(255, 255, 255, .45);
      flex-shrink: 0
    }

    .pill .p-badge {
      font-size: 10px;
      padding: 1px 4px;
      border-radius: 3px;
      font-weight: 700;
      flex-shrink: 0;
      line-height: 1.3
    }

    .pill .p-badge.t-text {
      background: rgba(255, 255, 255, .2);
      color: #fff
    }

    .pill .p-badge.t-number {
      background: rgba(255, 255, 255, .2);
      color: #fff
    }

    .pill .p-badge.t-date {
      background: rgba(255, 255, 255, .2);
      color: #fff
    }

    .pill .p-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .pill .p-chevron {
      font-size: 12px;
      color: rgba(255, 255, 255, .55);
      flex-shrink: 0;
      cursor: pointer;
      transition: color .15s
    }

    .pill .p-chevron:hover {
      color: #fff
    }

    .pill .p-rm {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      color: rgba(255, 255, 255, .5);
      padding: 0;
      line-height: 1;
      transition: color .15s
    }

    .pill .p-rm:hover {
      color: #fff
    }

    /* ===== Value pills (white card + select) ===== */
    .vpill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #fff;
      border: 1.5px dashed #ddd;
      border-radius: 8px;
      padding: 7px 10px;
      margin-bottom: 5px;
      cursor: grab;
      font-size: 13px;
      color: #333;
      user-select: none;
      transition: box-shadow .12s, opacity .15s
    }

    .vpill:active {
      cursor: grabbing
    }

    .vpill:hover {
      box-shadow: 0 1px 6px rgba(0, 0, 0, .06)
    }

    .vpill.dragging {
      opacity: .35
    }

    .vpill .p-handle {
      font-size: 12px;
      color: #ccc;
      flex-shrink: 0
    }

    .vpill .p-badge {
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 3px;
      font-weight: 700;
      flex-shrink: 0;
      line-height: 1.3
    }

    .vpill .p-badge.t-number {
      background: #e8f5e9;
      color: #2e7d32
    }

    .vpill .p-badge.t-text {
      background: #e3f2fd;
      color: #1565c0
    }

    .vpill .p-badge.t-date {
      background: #fff3e0;
      color: #e65100
    }

    .vpill .p-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 400
    }

    .vpill .p-select {
      border: 1.5px solid #ddd;
      border-radius: 5px;
      padding: 3px 6px;
      font-size: 12px;
      font-family: inherit;
      color: #555;
      background: #fff;
      cursor: pointer;
      min-width: 80px;
      transition: border-color .15s
    }

    .vpill .p-select:focus {
      outline: none;
      border-color: #1976d2;
      box-shadow: 0 0 0 2px rgba(25, 118, 210, .15)
    }

    .vpill .p-rm {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 15px;
      color: #ccc;
      padding: 0 2px;
      line-height: 1;
      transition: color .15s
    }

    .vpill .p-rm:hover {
      color: #e53935
    }

    /* ===== Context Menu ===== */
    .ctx-menu {
      position: fixed;
      z-index: 1000;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .12);
      min-width: 180px;
      max-height: 300px;
      overflow-y: auto;
      padding: 4px 0
    }

    .ctx-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      font-size: 13px;
      color: #333;
      cursor: pointer;
      transition: background .1s
    }

    .ctx-item:hover {
      background: #f5f5f5
    }

    .ctx-item .ci-dot {
      width: 9px;
      height: 9px;
      border-radius: 2px;
      flex-shrink: 0
    }

    .ctx-item .ci-name {
      flex: 1
    }

    .ctx-item .ci-type {
      font-size: 11px;
      color: #aaa;
      font-weight: 700
    }

    .ctx-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 999
    }

    /* ===== Pill settings panel ===== */
    .pill-settings {
      position: fixed;
      z-index: 1000;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      box-shadow: 0 6px 24px rgba(0,0,0,.14);
      width: 240px;
      padding: 14px 16px 16px;
      font-size: 13px;
      color: #333
    }

    .ps-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px
    }

    .ps-title {
      font-weight: 700;
      font-size: 14px;
      color: #111
    }

    .ps-close {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      color: #aaa;
      padding: 0;
      line-height: 1
    }

    .ps-close:hover { color: #333 }

    .ps-label {
      font-size: 11px;
      font-weight: 700;
      color: #888;
      text-transform: uppercase;
      letter-spacing: .4px;
      margin-bottom: 5px
    }

    .ps-select {
      width: 100%;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      font-family: inherit;
      color: #333;
      background: #f7f7f7;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L6 6L11 1' stroke='%23999' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 10px center;
      margin-bottom: 12px
    }

    .ps-select:focus {
      outline: none;
      border-color: #4caf50
    }

    .ps-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px
    }

    .ps-row > div { flex: 1 }

    .ps-checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
      cursor: pointer
    }

    .ps-checkbox-row input[type=checkbox] {
      width: 16px;
      height: 16px;
      accent-color: #4caf50;
      cursor: pointer;
      flex-shrink: 0
    }

    .ps-divider {
      border: none;
      border-top: 1px solid #f0f0f0;
      margin: 12px 0
    }

    .ps-remove {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 13px;
      color: #e53935;
      padding: 0;
      text-align: left;
      width: 100%
    }

    .ps-remove:hover { text-decoration: underline }

    /* ===== Available fields ===== */
    .fields-title {
      font-size: 14px;
      font-weight: 700;
      color: #222;
      padding: 0 0 8px
    }

    .fields-search {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0 0 8px;
      background: #f7f7f7;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 6px 10px;
      transition: border-color .15s
    }

    .fields-search:focus-within {
      border-color: #4caf50
    }

    .fields-search input {
      background: none;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 13px;
      color: #333;
      width: 100%
    }

    .fields-search .s-icon {
      display: flex;
      align-items: center;
      color: #bbb;
      flex-shrink: 0;
    }

    #field-list {
      display: flex;
      flex-direction: column;
      gap: 1px
    }

    .field-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 6px;
      cursor: default;
      font-size: 13px;
      color: #333;
      user-select: none;
      transition: background .1s
    }

    .field-item:hover {
      background: #f5f5f5
    }

    .field-item.dragging {
      opacity: .3
    }

    .field-item .f-handle {
      color: #d0d0d0;
      font-size: 14px;
      flex-shrink: 0;
      cursor: grab;
      padding: 2px 3px;
      margin: -2px -3px;
      border-radius: 3px;
      transition: color .15s
    }

    .field-item .f-handle:active {
      cursor: grabbing
    }

    .field-item:hover .f-handle {
      color: #aaa
    }

    .field-item .f-check {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      border: 1.5px solid #ccc;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #fff;
      cursor: pointer;
      transition: all .15s
    }

    .field-item .f-check:hover {
      border-color: #4caf50
    }

    .field-item .f-check.active {
      background: #4caf50;
      border-color: #4caf50
    }

    .field-item .f-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .field-item .f-type {
      font-size: 11px;
      color: #aaa;
      flex-shrink: 0;
      font-weight: 700
    }

    .sidebar-scroll::-webkit-scrollbar {
      width: 5px
    }

    .sidebar-scroll::-webkit-scrollbar-thumb {
      background: #d5d5d5;
      border-radius: 3px
    }

    .ghost {
      position: fixed;
      top: -9999px;
      left: -9999px;
      background: #3d8c40;
      border-radius: 5px;
      padding: 5px 14px;
      font-size: 12.5px;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      color: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .15);
      pointer-events: none;
      z-index: 9999
    }

    /* ===== Toast notifications ===== */
    #toast-container {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none
    }

    .toast {
      background: #fff;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 13px;
      box-shadow: 0 4px 16px rgba(0,0,0,.14);
      display: flex;
      align-items: flex-start;
      gap: 8px;
      max-width: 420px;
      animation: toastIn .2s ease;
      pointer-events: all;
      border-left: 4px solid #ff9800
    }

    .toast.toast-warn { border-left-color: #ff9800 }
    .toast.toast-error { border-left-color: #e53935 }
    .toast.toast-info { border-left-color: #4caf50 }

    .toast-icon { font-size: 15px; flex-shrink: 0; margin-top: 1px }
    .toast-body { flex: 1; line-height: 1.45; color: #333 }
    .toast-close { background: none; border: none; cursor: pointer; color: #aaa; font-size: 16px; padding: 0; line-height: 1; flex-shrink: 0 }
    .toast-close:hover { color: #555 }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(8px) }
      to   { opacity: 1; transform: translateY(0) }
    }

    /* ===== Validation banner ===== */
    .validation-banner {
      margin: 0 20px 10px;
      background: #fff8e1;
      border: 1px solid #ffe082;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 12.5px;
      color: #5d4037;
      display: none;
      gap: 8px;
      align-items: flex-start;
      line-height: 1.5
    }

    .validation-banner.visible { display: flex }
    .vb-icon { flex-shrink: 0; font-size: 15px }
    .vb-text { flex: 1 }
    .vb-close { background: none; border: none; cursor: pointer; color: #aaa; font-size: 15px; padding: 0 }

    /* ===== Field usage count badge ===== */
    .f-count {
      background: #4caf50;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      border-radius: 10px;
      padding: 1px 5px;
      flex-shrink: 0;
      line-height: 1.4
    }

    /* ===== Header top action buttons ===== */
    .header-top-icon-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      border-radius: 10px;
      cursor: pointer;
      color: rgba(0, 0, 0, 0.75);
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .header-top-icon-btn:hover {
      background: rgba(0, 0, 0, 0.06);
    }
    .header-top-icon-btn::after {
      content: attr(data-tooltip);
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-top: 6px;
      padding: 4px 8px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      border-radius: 4px;
      font-size: 12px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
      z-index: 1000;
    }
    .header-top-icon-btn:hover::after {
      opacity: 1;
    }
    .header-share-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 0 10px 0 8px;
      height: 28px;
      border: none;
      background: transparent;
      border-radius: 10px;
      cursor: pointer;
      color: rgba(0, 0, 0, 0.75);
      font-size: 14px;
      font-family: inherit;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .header-share-btn:hover {
      background: rgba(0, 0, 0, 0.06);
    }

    /* ===== Split button ===== */
    .split-btn {
      display: inline-flex;
      align-items: center;
      gap: 1px;
    }
    .split-btn-main {
      border-radius: 10px 0 0 10px !important;
    }
    .split-btn-arrow {
      width: 16px !important;
      min-width: 16px !important;
      border-radius: 0 10px 10px 0 !important;
      padding: 0 !important;
      color: rgb(0 0 0 / 75%);
    }
    .split-btn-arrow svg {
      width: 12px;
      height: 12px;
    }
    .split-btn:hover .split-btn-main,
    .split-btn:hover .split-btn-arrow {
      background: rgba(0, 0, 0, 0.06);
    }
    .split-btn-menu {
      position: fixed;
      display: none;
      flex-direction: column;
      background: #fff;
      border: 1px solid rgba(181, 183, 192, 0.4);
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      z-index: 2000;
      min-width: 160px;
      padding: 4px;
    }
    .split-btn-menu.open {
      display: flex;
    }
    .split-btn-menu-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      background: none;
      border: none;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      font-size: 13px;
      color: rgba(0, 0, 0, 0.8);
      border-radius: 7px;
      width: 100%;
    }
    .split-btn-menu-item:hover {
      background: rgba(0, 0, 0, 0.05);
    }
    .split-btn-color-dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      border: 1px solid rgba(0,0,0,0.15);
      flex-shrink: 0;
    }
  </style>
</head>

    /* ====== TOAST ====== */

    /* ====== VALIDATION ====== */
    function validateSource() {
      const issues = [];

        if (types.has('number') && types.has('string')) {
          issues.push(`Колонка «${h}» содержит и числа, и текст — возможны ошибки агрегации`);

    /* ====== LAYOUT CONTROLLER ====== */

    /* ====== PIVOT ====== */
    function computePivot() {
      const allRows = DATA.slice(1);
      const rF = zones.rows.map(e => FIELDS.find(x => x.id === e.fid)).filter(Boolean);
      const cF = zones.columns.map(e => FIELDS.find(x => x.id === e.fid)).filter(Boolean);
      const vE = zones.values;
      if (!rF.length && !cF.length && !vE.length) { pivotGrid = null; return }

      // Apply zone filters
      let filteredByFilter = allRows.filter(r => {
        return zones.filters.every(fe => {
          if (fe.selected === null) return true; // all selected
          const f = FIELDS.find(x => x.id === fe.fid); if (!f) return true;
          return fe.selected.includes(String(r[f.col]));
        });
      });

      // Apply sort from filter zone (last filter with sortOrder wins)
      const activeSortFilter = [...zones.filters].reverse().find(fe => fe.sortOrder && fe.sortOrder !== 'none');
      if (activeSortFilter) {
        const sf = FIELDS.find(x => x.id === activeSortFilter.fid);
        if (sf) {
          filteredByFilter = [...filteredByFilter].sort((a, b) => {
            const av = a[sf.col], bv = b[sf.col];
            const isNum = typeof av === 'number' && typeof bv === 'number';
            const cmp = isNum ? av - bv : String(av).localeCompare(String(bv), 'ru');
            return activeSortFilter.sortOrder === 'asc' ? cmp : -cmp;
          });
        }
      }

      // Filter blank rows — rows where ALL key fields are empty
      const keyFields = [...rF, ...cF];
      let blankCount = 0;
      const rows = filteredByFilter.filter(r => {
        if (!keyFields.length) return true;
        const allBlank = keyFields.every(f => r[f.col] === '' || r[f.col] === null || r[f.col] === undefined);
        if (allBlank) { blankCount++; return false; }
        return true;
      });
      if (blankCount > 0) {
        showToast(`Скрыто ${blankCount} пустых строк — они не попадают в сводную`, 'info', 4000);
      }
      const rMap = new Map(), cMap = new Map();
      rows.forEach(r => {
        const rk = rF.map(f => String(r[f.col])).join('|||');
        const ck = cF.map(f => String(r[f.col])).join('|||');
        if (!rMap.has(rk)) rMap.set(rk, rF.map(f => r[f.col]));
        if (!cMap.has(ck)) cMap.set(ck, cF.map(f => r[f.col]));
      });
      const rKeys = [...rMap.keys()], cKeys = [...cMap.keys()], rLabels = [...rMap.values()], cLabels = [...cMap.values()];

      // Apply sort from row zone settings
      const rSorted = rKeys.map((k, i) => ({ k, label: rLabels[i] }));
      if (zones.rows.length > 0) {
        const rowEntry = zones.rows[0];
        const sortOrder = rowEntry.sortOrder || 'asc';
        const sortFieldName = rowEntry.sortField;
        const sortField = sortFieldName ? FIELDS.find(x => x.name === sortFieldName) : null;

        if (sortField && sortField.type === 'number') {
          // Pre-aggregate to sort by value
          const preAgg = {};
          rKeys.forEach(rk => { preAgg[rk] = 0 });
          rows.forEach(r => {
            const rk = rF.map(f => String(r[f.col])).join('|||');
            if (preAgg[rk] === undefined) return;
            const sf = sortField; const v = r[sf.col]; const n = typeof v === 'number' ? v : parseFloat(v);
            if (!isNaN(n)) preAgg[rk] += n;
          });
          rSorted.sort((a, b) => sortOrder === 'asc' ? preAgg[a.k] - preAgg[b.k] : preAgg[b.k] - preAgg[a.k]);
        } else {
          rSorted.sort((a, b) => {
            const av = a.label[0] ?? '', bv = b.label[0] ?? '';
            const cmp = String(av).localeCompare(String(bv), 'ru');
            return sortOrder === 'asc' ? cmp : -cmp;
          });
        }
      }
      const sortedRKeys = rSorted.map(x => x.k);
      const sortedRLabels = rSorted.map(x => x.label);

      // showTotal: check any row zone entry
      const showTotal = zones.rows.length === 0 || zones.rows[0].showTotal !== false;
      const vc = Math.max(vE.length, 1), rhc = Math.max(rF.length, 1);
      const agg2 = {};
      sortedRKeys.forEach(rk => { agg2[rk] = {}; cKeys.forEach(ck => { agg2[rk][ck] = vE.map(() => ({ s: 0, c: 0, mx: -Infinity, mn: Infinity, cnt: 0 })) }) });
      rows.forEach(r => {
        const rk = rF.map(f => String(r[f.col])).join('|||');
        const ck = cF.map(f => String(r[f.col])).join('|||');
        if (!agg2[rk]) return;
        vE.forEach((ve, vi) => {
          const f = FIELDS.find(x => x.id === ve.fid); if (!f) return;
          const v = r[f.col], n = typeof v === 'number' ? v : parseFloat(v);
          const b = agg2[rk][ck][vi]; if (!isNaN(n)) { b.s += n; b.mx = Math.max(b.mx, n); b.mn = Math.min(b.mn, n); b.cnt++ } b.c += 1;
        });
      });
      function gv(b, a) { if (!b) return 0; switch (a) { case 'СУММ': return b.s; case 'СЧЁТ': return b.c; case 'СРЕДНЕЕ': return b.cnt ? Math.round(b.s / b.cnt * 100) / 100 : 0; case 'МАКС': return b.mx === -Infinity ? 0 : b.mx; case 'МИН': return b.mn === Infinity ? 0 : b.mn; default: return b.s } }

      const grid = [];
      if (cF.length) cF.forEach((cf, cfi) => { const row = new Array(rhc).fill(''); row._meta = new Array(rhc).fill('header'); cLabels.forEach(cl => { for (let vi = 0; vi < vc; vi++) { row.push(cl[cfi] ?? ''); row._meta.push('header') } }); grid.push(row) });
      const lr = []; lr._meta = [];
      rF.forEach(f => { lr.push(f.name); lr._meta.push('header') }); if (!rF.length) { lr.push(''); lr._meta.push('header') }
      const colsI = cKeys.length ? cKeys : [''];
      colsI.forEach(() => { vE.forEach(ve => { const f = FIELDS.find(x => x.id === ve.fid); const a = ve.agg || (f && f.type === 'number' ? 'СУММ' : 'СЧЁТ'); lr.push(`${f ? f.name : '?'} (${AGG_REV[a] || a})`); lr._meta.push('header') }) });
      if (!vE.length && !cKeys.length) { lr.push(''); lr._meta.push('header') }
      grid.push(lr);
      sortedRKeys.forEach((rk, ri) => {
        const dr = []; dr._meta = []; const rl = sortedRLabels[ri];
        for (let i = 0; i < rhc; i++) { dr.push(rl && i < rl.length ? rl[i] : ''); dr._meta.push('') }
        colsI.forEach(ck => { vE.forEach((ve, vi) => { const f = FIELDS.find(x => x.id === ve.fid); const a = ve.agg || (f && f.type === 'number' ? 'СУММ' : 'СЧЁТ'); dr.push(gv(agg2[rk] && agg2[rk][ck] ? agg2[rk][ck][vi] : null, a)); dr._meta.push('') }) }); grid.push(dr)
      });
      if (showTotal && sortedRKeys.length > 1 && vE.length) {
        const tr = []; tr._meta = [];
        for (let i = 0; i < rhc; i++) { tr.push(i === 0 ? 'Итого' : ''); tr._meta.push('total') }
        colsI.forEach(ck => { vE.forEach((ve, vi) => { const f = FIELDS.find(x => x.id === ve.fid); const a = ve.agg || (f && f.type === 'number' ? 'СУММ' : 'СЧЁТ'); let t = 0; sortedRKeys.forEach(rk => { t += gv(agg2[rk] && agg2[rk][ck] ? agg2[rk][ck][vi] : null, a) }); tr.push(t); tr._meta.push('total') }) }); grid.push(tr)
      }
      pivotGrid = grid;
    }

    function closeCtxMenu() { document.querySelectorAll('.ctx-menu,.ctx-overlay,.filter-popup,.pill-settings').forEach(el => el.remove()) }
    function initZoneAddButtons() { document.querySelectorAll('.zone-add').forEach(b => { const nb = b.cloneNode(true); b.parentNode.replaceChild(nb, b); nb.addEventListener('click', e => { e.stopPropagation(); showCtxMenu(nb.dataset.zone, nb) }); }); }

    /* ====== REORDER within zone ====== */
    function clearReorderIndicators() {
      document.querySelectorAll('.pill, .vpill, .filter-pill').forEach(p => {
        p.style.borderTop = '';
        p.style.borderBottom = '';
      });
    }

    function addReorderDragover(pill, zone, idx) {
      pill.addEventListener('dragover', e => {
        const d = window._currentDragData;
        if (!d || d.src !== 'zone' || d.sz !== zone) return;
        e.preventDefault();
        e.stopPropagation(); // prevent zone handler from also firing
        e.dataTransfer.dropEffect = 'move';
        clearReorderIndicators();
        const rect = pill.getBoundingClientRect();
        const after = e.clientY > rect.top + rect.height / 2;
        pill.style.borderTop = after ? '' : '2px solid #4caf50';
        pill.style.borderBottom = after ? '2px solid #4caf50' : '';
        pill._reorderAfter = after;
      });

      pill.addEventListener('dragleave', e => {
        if (!pill.contains(e.relatedTarget)) {
          pill.style.borderTop = '';
          pill.style.borderBottom = '';
        }
      });

      pill.addEventListener('drop', e => {
        e.preventDefault();
        e.stopPropagation();
        clearReorderIndicators();
        let d; try { d = JSON.parse(e.dataTransfer.getData('text/plain')); } catch { return; }
        if (!d || d.src !== 'zone' || d.sz !== zone || d.si === idx) return;
        const item = zones[zone].splice(d.si, 1)[0];
        const after = pill._reorderAfter;
        // Adjust index after removal
        let insertAt = idx;
        if (d.si < idx) insertAt--; // shift left because we removed before target
        if (after) insertAt++;
        zones[zone].splice(Math.max(0, Math.min(zones[zone].length, insertAt)), 0, item);
        renderAll();
      });
    }

    /* ====== RENDER ZONES ====== */
    const ZONE_HINT = { rows: 'Перетащите поле сюда, чтобы добавить строки', columns: 'Перетащите поле сюда, чтобы добавить столбцы', values: 'Перетащите поле сюда, чтобы добавить значения', filters: 'Перетащите поле для фильтрации' };

    function renderZones() {
      ['rows', 'columns', 'values', 'filters'].forEach(z => {
        const drop = document.getElementById('drop-' + z);
        const items = zones[z];
        if (!items.length) {
          drop.classList.remove('has-items');
          drop.innerHTML = `<div class="zone-empty"><div class="zone-empty-icon">${EMPTY_SVG}</div><div class="zone-empty-text">${ZONE_HINT[z]}</div></div>`;
          return;
        }
        drop.classList.add('has-items');
        drop.innerHTML = '';
        items.forEach((entry, i) => {
          const f = FIELDS.find(x => x.id === entry.fid); if (!f) return;

          if (z === 'values') {
            // Value pill with select dropdown
            const p = document.createElement('div'); p.className = 'vpill'; p.draggable = true;
            const curAgg = entry.agg || (f.type === 'number' ? 'СУММ' : 'СЧЁТ');
            const curLabel = AGG_REV[curAgg] || curAgg;
            let opts = AGG_OPTIONS.map(a => `<option${a === curLabel ? ' selected' : ''}>${a}</option>`).join('');
            p.innerHTML = `<span class="p-handle">⠿</span><span class="p-badge ${TYPE_BADGE[f.type]}">${TYPE_ICON[f.type]}</span><span class="p-name">${f.name}</span><select class="p-select">${opts}</select><button class="p-rm">✕</button>`;
            p.querySelector('.p-select').addEventListener('change', e => { e.stopPropagation(); zones[z][i].agg = AGG_MAP[e.target.value] || 'СУММ'; renderSheet() });
            p.querySelector('.p-select').addEventListener('mousedown', e => e.stopPropagation());
            p.querySelector('.p-rm').addEventListener('click', e => { e.stopPropagation(); zones[z].splice(i, 1); renderAll() });
            p.addEventListener('dragstart', e => { const d = { fid: entry.fid, src: 'zone', sz: z, si: i }; e.dataTransfer.setData('text/plain', JSON.stringify(d)); e.dataTransfer.effectAllowed = 'move'; p.classList.add('dragging'); window._currentDragData = d; mkGhost(e, f.name) });
            p.addEventListener('dragend', () => { p.classList.remove('dragging'); window._currentDragData = null; });
            addReorderDragover(p, z, i);
            drop.appendChild(p);
          } else {
            // Standard green pill
            const p = document.createElement('div'); p.className = 'pill'; p.draggable = true;
            p.innerHTML = `<span class="p-handle">⠿</span><span class="p-badge ${TYPE_BADGE[f.type]}">${TYPE_ICON[f.type]}</span><span class="p-name">${f.name}</span><span class="p-chevron">▾</span><button class="p-rm">✕</button>`;
            p.querySelector('.p-rm').addEventListener('click', e => { e.stopPropagation(); zones[z].splice(i, 1); renderAll() });
            p.querySelector('.p-chevron').addEventListener('click', e => { e.stopPropagation(); showPillMenu(z, i, f, e.target) });
            p.addEventListener('dragstart', e => { const d = { fid: entry.fid, src: 'zone', sz: z, si: i }; e.dataTransfer.setData('text/plain', JSON.stringify(d)); e.dataTransfer.effectAllowed = 'move'; p.classList.add('dragging'); window._currentDragData = d; mkGhost(e, f.name) });
            p.addEventListener('dragend', () => { p.classList.remove('dragging'); window._currentDragData = null; });
            addReorderDragover(p, z, i);
            drop.appendChild(p);
          }
        });
      });

      initZoneAddButtons();

      // Render filter pills separately
      const fdrop = document.getElementById('drop-filters');
      if (fdrop) {
        const fitems = zones.filters;
        if (!fitems.length) {
          fdrop.classList.remove('has-items');
          fdrop.innerHTML = `<div class="zone-empty"><div class="zone-empty-icon">${EMPTY_SVG}</div><div class="zone-empty-text">${ZONE_HINT['filters']}</div></div>`;
        } else {
          fdrop.classList.add('has-items');
          fdrop.innerHTML = '';
          fitems.forEach((entry, i) => {
            const f = FIELDS.find(x => x.id === entry.fid); if (!f) return;
            const activeCount = entry.selected ? entry.selected.length : (entry.allVals || []).length;
            const totalCount = (entry.allVals || []).length;
            const isFiltered = entry.selected !== null;
            const hasSortOrder = entry.sortOrder && entry.sortOrder !== 'none';
            const sortIcon = entry.sortOrder === 'asc' ? ' ↑' : entry.sortOrder === 'desc' ? ' ↓' : '';
            const p = document.createElement('div'); p.className = 'filter-pill'; p.draggable = true;
            p.innerHTML = `
              <span class="fp-handle">⠿</span>
              <span class="fp-badge ${TYPE_BADGE[f.type]}">${TYPE_ICON[f.type]}</span>
              <span class="fp-name">${f.name}</span>
              <span class="fp-count" style="color:${isFiltered || hasSortOrder ? '#e65100' : '#aaa'}">${activeCount}/${totalCount}${sortIcon}</span>
              <span class="fp-chevron" title="Настроить фильтр">▾</span>
              <button class="fp-rm" title="Убрать">✕</button>`;
            p.querySelector('.fp-chevron').addEventListener('click', e => { e.stopPropagation(); showFilterPopup(i, e.target); });
            p.querySelector('.fp-name').addEventListener('click', e => { e.stopPropagation(); showFilterPopup(i, e.target); });
            p.querySelector('.fp-rm').addEventListener('click', e => { e.stopPropagation(); zones.filters.splice(i, 1); renderAll(); });
            p.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', JSON.stringify({ fid: entry.fid, src: 'zone', sz: 'filters', si: i })); e.dataTransfer.effectAllowed = 'move'; p.classList.add('dragging'); mkGhost(e, f.name); });
            p.addEventListener('dragend', () => p.classList.remove('dragging'));
            fdrop.appendChild(p);
          });
        }
      }
    }

    function showPillMenu(z, i, f, anchor) {
      closeCtxMenu();
      const entry = zones[z][i];
      const rect = anchor.getBoundingClientRect();

      const ov = document.createElement('div'); ov.className = 'ctx-overlay'; ov.addEventListener('click', closeCtxMenu); document.body.appendChild(ov);

      const panel = document.createElement('div'); panel.className = 'pill-settings';

      // Sort field options: own name + numeric value fields
      const sortFieldOptions = [f.name, ...FIELDS.filter(x => x.type === 'number' && x.id !== f.id).map(x => x.name)];

      panel.innerHTML = `
        <div class="ps-header">
          <span class="ps-title">${f.name}</span>
          <button class="ps-close">✕</button>
        </div>
        <div class="ps-label">Сортировка по</div>
        <select class="ps-select" id="ps-sort-field">
          ${sortFieldOptions.map(n => `<option${(entry.sortField || f.name) === n ? ' selected' : ''}>${n}</option>`).join('')}
        </select>
        <div class="ps-label">Порядок</div>
        <select class="ps-select" id="ps-sort-order">
          <option${(entry.sortOrder || 'asc') === 'asc' ? ' selected' : ''}>По возрастанию</option>
          <option${entry.sortOrder === 'desc' ? ' selected' : ''}>По убыванию</option>
        </select>
        <label class="ps-checkbox-row">
          <input type="checkbox" id="ps-show-total" ${entry.showTotal !== false ? 'checked' : ''}>
          <span>Показывать итог</span>
        </label>
        <hr class="ps-divider">
        <button class="ps-remove">Убрать поле</button>
      `;

      // Position
      panel.style.top = (rect.bottom + 6) + 'px';
      panel.style.left = Math.max(4, rect.left - 80) + 'px';
      document.body.appendChild(panel);

      // Clamp to viewport
      requestAnimationFrame(() => {
        const pr = panel.getBoundingClientRect();
        if (pr.bottom > window.innerHeight - 8) panel.style.top = (rect.top - pr.height - 6) + 'px';
        if (pr.right > window.innerWidth - 8) panel.style.left = (window.innerWidth - pr.width - 8) + 'px';
      });

      panel.querySelector('.ps-close').addEventListener('click', closeCtxMenu);

      panel.querySelector('#ps-sort-field').addEventListener('change', e => {
        zones[z][i].sortField = e.target.value; renderSheet();
      });

      panel.querySelector('#ps-sort-order').addEventListener('change', e => {
        zones[z][i].sortOrder = e.target.value === 'По возрастанию' ? 'asc' : 'desc'; renderSheet();
      });

      panel.querySelector('#ps-show-total').addEventListener('change', e => {
        zones[z][i].showTotal = e.target.checked; renderSheet();
      });

      panel.querySelector('.ps-remove').addEventListener('click', () => {
        zones[z].splice(i, 1); closeCtxMenu(); renderAll();
      });

      // Prevent overlay click from firing when clicking inside panel
      panel.addEventListener('click', e => e.stopPropagation());
    }

    /* ====== FIELDS ====== */
    // Default zone to add field when checkbox clicked
    function defaultZoneForField(f) {
      return f.type === 'number' ? 'values' : 'rows';
    }

    function toggleFieldByCheckbox(f) {
      const counts = fieldUsageCounts();
      if (counts[f.id]) {
        // Remove from ALL zones
        ['rows', 'columns', 'values', 'filters'].forEach(z => {
          zones[z] = zones[z].filter(e => e.fid !== f.id);
        });
      } else {
        // Add to default zone
        const z = defaultZoneForField(f);
        const defaultAgg = z === 'values' ? (f.type === 'number' ? 'СУММ' : 'СЧЁТ') : undefined;
        if (z === 'values' && f.type !== 'number') {
          showToast(`«${f.name}» — текстовое поле. Применено «Количество»`, 'warn');
        }
        zones[z].push({ fid: f.id, agg: defaultAgg });
      }
      renderAll();
    }

    function renderFields(filter = '') {
      const c = document.getElementById('field-list'); c.innerHTML = '';
      const lf = filter.toLowerCase(), counts = fieldUsageCounts();
      FIELDS.forEach(f => {
        if (lf && !f.name.toLowerCase().includes(lf)) return;
        const el = document.createElement('div'); el.className = 'field-item';
        const cnt = counts[f.id] || 0;
        const isActive = cnt > 0;

        // Checkbox
        const chk = document.createElement('span');
        chk.className = 'f-check' + (isActive ? ' active' : '');
        chk.innerHTML = isActive ? '✓' : '';
        chk.addEventListener('click', e => { e.stopPropagation(); toggleFieldByCheckbox(f); });

        // Handle (drag-only)
        const handle = document.createElement('span');
        handle.className = 'f-handle';
        handle.textContent = '⠿';

        // Name
        const name = document.createElement('span');
        name.className = 'f-name';
        name.textContent = f.name;

        // Type
        const type = document.createElement('span');
        type.className = 'f-type';
        type.textContent = TYPE_ICON[f.type];

        // Usage count badge (replaces checkbox when multi-used)
        if (cnt > 1) {
          const badge = document.createElement('span');
          badge.className = 'f-count';
          badge.textContent = cnt;
          el.append(handle, chk, name, type, badge);
        } else {
          el.append(handle, chk, name, type);
        }

        // Drag only from handle
        handle.addEventListener('mousedown', () => { el.draggable = true; });
        el.addEventListener('dragstart', e => {
          e.dataTransfer.setData('text/plain', JSON.stringify({ fid: f.id, src: 'field' }));
          e.dataTransfer.effectAllowed = 'copy';
          el.classList.add('dragging');
          mkGhost(e, f.name);
        });
        el.addEventListener('dragend', () => { el.classList.remove('dragging'); el.draggable = false; });

        c.appendChild(el);
      });
    }
    function mkGhost(e, t) { const g = document.createElement('div'); g.className = 'ghost'; g.textContent = t; document.body.appendChild(g); e.dataTransfer.setDragImage(g, 0, 0); requestAnimationFrame(() => g.remove()) }

    /* ====== DROP ====== */
    function initDrop() {
      document.querySelectorAll('.zone-drop').forEach(el => {
        const z = el.dataset.zone;
        el.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; el.classList.add('drag-over') });
        el.addEventListener('dragleave', e => { if (!el.contains(e.relatedTarget)) { el.classList.remove('drag-over'); } });
        el.addEventListener('drop', e => {
          e.preventDefault(); el.classList.remove('drag-over');
          let d; try { d = JSON.parse(e.dataTransfer.getData('text/plain')) } catch { return }
          const f = FIELDS.find(x => x.id === d.fid); if (!f) return;

          clearReorderIndicators();

          // Remove from source zone if moved (not copied from sidebar)
          if (d.src === 'zone' && d.sz) zones[d.sz].splice(d.si, 1);

          // Auto-aggregation + warning for text in values
          const defaultAgg = z === 'values'
            ? (f.type === 'number' ? 'СУММ' : 'СЧЁТ')
            : undefined;

          if (z === 'values' && f.type !== 'number') {
            showToast(`«${f.name}» — текстовое поле. Применено «Количество» — суммировать текст невозможно`, 'warn');
          }

          // Warn if number dropped into rows/columns
          if ((z === 'rows' || z === 'columns') && f.type === 'number') {
            showToast(`«${f.name}» — числовое поле. В строках/столбцах создаст группу для каждого уникального значения`, 'warn');
          }

          if (z === 'filters') {
            const col = FIELDS.find(x => x.id === d.fid)?.col;
            const allVals = col !== undefined ? [...new Set(DATA.slice(1).map(r => String(r[col])).filter(v => v !== '' && v !== 'undefined'))] : [];
            zones.filters.push({ fid: f.id, selected: null, allVals });
          } else {
            zones[z].push({ fid: f.id, agg: defaultAgg });
          }
          renderAll();
        });
      });

      // Drop back to field list = remove
      const fl = document.getElementById('field-list');
      fl.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move' });
      fl.addEventListener('drop', e => {
        e.preventDefault(); let d; try { d = JSON.parse(e.dataTransfer.getData('text/plain')) } catch { return }
        if (d.src === 'zone' && d.sz) { zones[d.sz].splice(d.si, 1); renderAll() }
      });
    }

    function renderAll() { renderZones(); renderFields(document.getElementById('search-input').value); renderSheet() }

    document.getElementById('search-input').addEventListener('input', e => renderFields(e.target.value));

    /* ====== FILTER POPUP ====== */
    function showFilterPopup(i, anchor) {
      closeCtxMenu();
      const entry = zones.filters[i];
      const f = FIELDS.find(x => x.id === entry.fid); if (!f) return;
      const allVals = entry.allVals || [];
      let selected = entry.selected ? new Set(entry.selected) : new Set(allVals);
      let filtered = [...allVals];

      const ov = document.createElement('div'); ov.className = 'ctx-overlay'; ov.addEventListener('click', closeCtxMenu); document.body.appendChild(ov);
      const popup = document.createElement('div'); popup.className = 'filter-popup';

      function render() {
        const searchVal = popup.querySelector('#fpp-search-inp')?.value || '';
        const allChecked = filtered.every(v => selected.has(v));
        const sortOrder = entry.sortOrder || 'none';
        const isNum = f.type === 'number';
        const sortLabel = {
          none: isNum ? '— Порядок' : '— Порядок',
          asc:  isNum ? '↑ По возрастанию' : '↑ А → Я',
          desc: isNum ? '↓ По убыванию'   : '↓ Я → А',
        };
        popup.innerHTML = `
          <div class="fpp-title">${f.name}</div>
          <div class="fpp-sort">
            <span class="fpp-sort-label">Сортировка</span>
            <div class="fpp-sort-btns">
              <button class="fpp-sort-btn${sortOrder === 'asc'  ? ' active' : ''}" data-sort="asc">${isNum ? '↑ Меньше→Больше' : '↑ А → Я'}</button>
              <button class="fpp-sort-btn${sortOrder === 'desc' ? ' active' : ''}" data-sort="desc">${isNum ? '↓ Больше→Меньше' : '↓ Я → А'}</button>
            </div>
          </div>
          <div class="fpp-search"><span>🔍</span><input type="text" id="fpp-search-inp" placeholder="Поиск..." value="${searchVal}"></div>
          <label class="fpp-all"><input type="checkbox" id="fpp-all" ${allChecked ? 'checked' : ''}><span>Выбрать все</span></label>
          <div class="fpp-values">${filtered.map(v => `<label class="fpp-val"><input type="checkbox" value="${v}" ${selected.has(v) ? 'checked' : ''}><span>${v}</span></label>`).join('')}</div>
          <div class="fpp-actions">
            <button class="fpp-btn" id="fpp-cancel">Отмена</button>
            <button class="fpp-btn primary" id="fpp-ok">Применить</button>
          </div>`;
        popup.querySelectorAll('.fpp-sort-btn').forEach(btn => {
          btn.addEventListener('click', e => {
            e.stopPropagation();
            const newSort = btn.dataset.sort;
            entry.sortOrder = entry.sortOrder === newSort ? 'none' : newSort;
            render();
          });
        });
        popup.querySelector('#fpp-search-inp').addEventListener('input', e => {
          const q = e.target.value.toLowerCase();
          filtered = allVals.filter(v => v.toLowerCase().includes(q));
          render();
          popup.querySelector('#fpp-search-inp').focus();
        });
        popup.querySelector('#fpp-all').addEventListener('change', e => {
          if (e.target.checked) filtered.forEach(v => selected.add(v));
          else filtered.forEach(v => selected.delete(v));
          render();
        });
        popup.querySelectorAll('.fpp-val input').forEach(cb => {
          cb.addEventListener('change', e => {
            if (e.target.checked) selected.add(e.target.value);
            else selected.delete(e.target.value);
          });
        });
        popup.querySelector('#fpp-cancel').addEventListener('click', e => {
          e.stopPropagation();
          document.querySelectorAll('.filter-popup, .ctx-overlay').forEach(el => el.remove());
        });
        popup.querySelector('#fpp-ok').addEventListener('click', () => {
          zones.filters[i].selected = selected.size === allVals.length ? null : [...selected];
          zones.filters[i].sortOrder = entry.sortOrder || 'none';
          document.querySelectorAll('.filter-popup, .ctx-overlay').forEach(el => el.remove());
          renderAll();
        });
        popup.addEventListener('click', e => e.stopPropagation());
      }

      render();
      const rect = anchor.getBoundingClientRect();
      popup.style.top = (rect.bottom + 6) + 'px';
      popup.style.left = Math.max(4, rect.left - 40) + 'px';
      document.body.appendChild(popup);
      requestAnimationFrame(() => {
        const pr = popup.getBoundingClientRect();
        if (pr.bottom > window.innerHeight - 8) popup.style.top = (rect.top - pr.height - 6) + 'px';
        if (pr.right > window.innerWidth - 8) popup.style.left = (window.innerWidth - pr.width - 8) + 'px';
      });
    }

    /* ====== DRAG ZONE HIGHLIGHT ====== */
    // Highlight only the zone being hovered — not all zones simultaneously
    // We patch initDrop to add per-zone enter/leave highlighting
    function initZoneHighlight() {
      document.querySelectorAll('.zone-drop').forEach(zone => {
        zone.addEventListener('dragenter', e => {
          if (e.dataTransfer.types.includes('text/plain')) {
            zone.classList.add('drag-ready');
          }
        });
        zone.addEventListener('dragleave', e => {
          if (!zone.contains(e.relatedTarget)) {
            zone.classList.remove('drag-ready');
          }
        });
        zone.addEventListener('drop', () => zone.classList.remove('drag-ready'));
      });
    }

    document.addEventListener('dragend', () => {
      document.querySelectorAll('.zone-drop').forEach(z => z.classList.remove('drag-ready'));
      clearReorderIndicators();
    });

    /* ====== CELL SELECTION ====== */
    let selectedCell = null;

    function clearCellHighlights(table) {
      table.querySelectorAll('thead th.col-highlight').forEach(th => th.classList.remove('col-highlight'));
      table.querySelectorAll('td.rn.row-highlight').forEach(td => td.classList.remove('row-highlight'));
    }

    function selectCell(td) {
      if (!td) return;
      const table = td.closest('table'); if (!table) return;
      // Clear previous highlights
      clearCellHighlights(table);
      if (selectedCell) selectedCell.classList.remove('selected');
      // Apply new selection
      td.classList.add('selected');
      selectedCell = td;
      const row = td.parentElement;
      const ci = [...row.children].indexOf(td);
      const ths = [...table.querySelectorAll('thead tr th')];
      if (ths[ci]) ths[ci].classList.add('col-highlight');
      const rnCell = row.querySelector('td.rn');
      if (rnCell) rnCell.classList.add('row-highlight');
      const val = td.textContent.trim();
      const ri = [...table.querySelectorAll('tbody tr')].indexOf(row);
      const colLetter = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'[ci - 1] || '';
      document.querySelector('.fb-cell').textContent = colLetter + (ri + 1);
      document.querySelector('.fb-input').value = val;
    }

    function selectDefaultCell() {
      // Select first data cell (row 1, col A = first td after rn)
      const firstRow = document.querySelector('#grid-scroll tbody tr');
      if (!firstRow) return;
      const firstCell = firstRow.querySelector('td:not(.rn)');
      if (firstCell) selectCell(firstCell);
    }

    document.getElementById('grid-scroll').addEventListener('click', e => {
      const td = e.target.closest('td');
      if (!td || td.classList.contains('rn')) return;
      // Always select — no toggle off
      selectCell(td);
    });

    /* ====== SIDEBAR CLOSE ====== */
    document.querySelector('.sidebar-close').addEventListener('click', () => {
      layout.toggleSidebar(false);
      // Switch back to source tab
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.sheet === 'source'));
      activeSheet = 'source';
      renderSheet();
    });

    /* ====== FILL SPLIT-BUTTON ====== */
    (function() {
      const fillColorBtn = document.getElementById('fillColorBtn');
      const fillArrowBtn = document.getElementById('fillArrowBtn');
      const fillMenu     = document.getElementById('fillMenu');
      const fillYellow   = document.getElementById('fillYellow');
      const fillClear    = document.getElementById('fillClear');
      if (!fillColorBtn || !fillArrowBtn || !fillMenu) return;

      function applyFill(color) {
        const cell = document.querySelector('td.selected');
        if (cell) cell.style.background = color;
        fillMenu.classList.remove('open');
      }

      fillColorBtn.addEventListener('click', function() {
        applyFill('#fff176');
      });

      fillArrowBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        const r = fillArrowBtn.getBoundingClientRect();
        fillMenu.style.left = r.left + 'px';
        fillMenu.style.top  = (r.bottom + 4) + 'px';
        fillMenu.classList.toggle('open');
      });

      fillYellow.addEventListener('click', function(e) {
        e.stopPropagation();
        applyFill('#fff176');
      });

      fillClear.addEventListener('click', function(e) {
        e.stopPropagation();
        applyFill('');
      });

      document.addEventListener('click', function() {
        fillMenu.classList.remove('open');
      });
    })();

    /* ====== FILTER SPLIT-BUTTON ====== */
    (function() {
      const filterArrowBtn = document.getElementById('filterArrowBtn');
      const filterMenu     = document.getElementById('filterMenu');
      if (!filterArrowBtn || !filterMenu) return;

      filterArrowBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        const r = filterArrowBtn.getBoundingClientRect();
        filterMenu.style.left = r.left + 'px';
        filterMenu.style.top  = (r.bottom + 4) + 'px';
        filterMenu.classList.toggle('open');
      });

      filterMenu.querySelectorAll('.split-btn-menu-item').forEach(function(item) {
        item.addEventListener('click', function(e) {
          e.stopPropagation();
          filterMenu.classList.remove('open');
        });
      });

      document.addEventListener('click', function() {
        filterMenu.classList.remove('open');
      });
    })();

    /* ====== INIT ====== */
    renderFields(); renderZones(); initDrop(); initZoneHighlight(); renderSheet(); initZoneAddButtons();
  </script>
</body>

</html>
