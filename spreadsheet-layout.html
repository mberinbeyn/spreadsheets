<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spreadsheet Prototype Layout</title>
  <!-- Gravity UI design tokens & base styles -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gravity-ui/uikit@7.32.0/styles/styles.css">
  <!-- Inter font (used by Gravity UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <style>
    /* ============================================================
       DESIGN TOKENS
       Change these variables to adapt the layout to your design.
       ============================================================ */
    :root {
      /* Structural dimensions */
      --header-height:       92px;
      --formula-bar-height:  32px;
      --sheets-bar-height:   28px;
      --sidebar-width:      320px;
      --sidebar-min-width:  160px;
      --sidebar-max-width:  600px;
      --resize-handle-size:   4px;

      /* Layout colors — now driven by Gravity UI tokens where possible */
      --color-sidebar:      #FFE600;
      --color-resize-hover: rgba(0, 0, 0, 0.08);

      /* Grid tokens */
      --col-header-height:  20px;
      --row-header-width:   46px;
      --cell-width:         100px;
      --cell-height:        20px;
      /* cell border picks up Gravity UI token at runtime */
      --cell-border:        var(--g-color-line-generic-solid, #d0d0d0);
    }


    /* ============================================================
       RESET
       ============================================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }


    /* ============================================================
       APP SHELL  —  CSS Grid
       ┌───────────────────────────┐
       │         HEADER            │  row 1  full width
       ├──────────────┬────────────┤
       │  WORKSPACE   │  SIDEBAR   │  row 2  1fr | sidebar-width
       ├──────────────┴────────────┤
       │         SHEETS BAR        │  row 3  full width
       └───────────────────────────┘
       ============================================================ */
    .app {
      display: grid;
      grid-template-columns: 1fr var(--sidebar-width);
      grid-template-rows:
        var(--header-height)
        1fr
        var(--sheets-bar-height);
      height: 100vh;
      width: 100%;
      transition: grid-template-columns 0.2s ease;
    }

    /* Sidebar hidden: collapse to zero width */
    .app.sidebar-hidden {
      grid-template-columns: 1fr 0;
    }


    /* ============================================================
       BASE FONT — inherit Gravity UI Inter
       ============================================================ */
    html, body {
      font-family: var(--g-font-family-sans, 'Inter', Arial, sans-serif);
    }

    /* ============================================================
       HEADER  (uses Gravity UI design tokens)
       ============================================================ */
    .app-header {
      grid-column: 1 / -1;
      grid-row: 1;
      background: var(--g-color-base-background);
      border-bottom: 1px solid var(--g-color-line-generic-solid);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
      position: relative;
    }

    /* Background SVG pinned to top-right of header */
    .hdr-bg {
      position: absolute;
      right: 0;
      top: 0;
      pointer-events: none;
      line-height: 0;
      z-index: 0;
    }

    /* Ensure header content sits above the background */
    .hdr-title-row,
    .hdr-menu-row,
    .hdr-toolbar-row {
      position: relative;
      z-index: 1;
    }

    /* ── Title row ─────────────────────────────────────────────── */
    .hdr-title-row {
      display: flex;
      align-items: center;
      height: 40px;
      padding: 0 8px;
      gap: var(--g-spacing-2);  /* 8px */
      flex-shrink: 0;
    }

    /* Spreadsheet logo icon (pure CSS) */
    .hdr-logo-icon {
      width: 22px;
      height: 26px;
      background: #1db862;          /* sheets green — intentionally hardcoded brand */
      border-radius: 3px;
      flex-shrink: 0;
      position: relative;
    }
    .hdr-logo-icon::before {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 6px; height: 6px;
      background: rgba(255,255,255,.45);
      clip-path: polygon(0 0, 100% 100%, 100% 0);
    }
    .hdr-logo-icon::after {
      content: '';
      position: absolute;
      inset: 9px 3px 3px;
      background:
        repeating-linear-gradient(to bottom,
          rgba(255,255,255,.55) 0, rgba(255,255,255,.55) 1.5px,
          transparent 1.5px, transparent 3.5px),
        repeating-linear-gradient(to right,
          rgba(255,255,255,.55) 0, rgba(255,255,255,.55) 1px,
          transparent 1px, transparent 6px);
    }

    .hdr-title {
      font-size: 15px;
      font-weight: 500;
      color: var(--g-color-text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 280px;
      line-height: 1;
    }

    /* Tiny icon buttons in title row */
    .hdr-icon-btn {
      width: 28px; height: 28px;
      border: none;
      background: none;
      border-radius: var(--g-border-radius-m, 6px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--g-color-text-complementary);
      transition: background .12s;
      padding: 0;
    }
    .hdr-icon-btn:hover {
      background: var(--g-color-base-simple-hover);
    }
    .hdr-icon-btn svg { width: 16px; height: 16px; }

    .hdr-title-actions {
      display: flex;
      align-items: center;
      gap: var(--g-spacing-1);   /* 4px */
      margin-left: auto;
    }

    /* Gravity-branded Share button — brand=yellow, text=dark */
    .hdr-share-btn {
      height: 28px;
      padding: 0 var(--g-spacing-3);   /* 0 12px */
      border: none;
      border-radius: 14px;
      background: var(--g-color-base-brand);
      color: var(--g-color-text-brand-contrast);
      font-size: 13px;
      font-family: var(--g-font-family-sans);
      font-weight: var(--g-text-accent-font-weight, 600);
      cursor: pointer;
      white-space: nowrap;
      transition: background .12s;
    }
    .hdr-share-btn:hover { background: var(--g-color-base-brand-hover); }

    .hdr-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: #e5562c;       /* user accent — intentional hardcode */
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* ── Menu row ──────────────────────────────────────────────── */
    .hdr-menu-row {
      display: flex;
      align-items: center;
      height: 24px;
      padding: 0 var(--g-spacing-10);  /* 0 40px */
      flex-shrink: 0;
    }

    .hdr-menu-item {
      height: 24px;
      padding: 0 var(--g-spacing-2);   /* 0 8px */
      font-size: 12px;
      color: var(--g-color-text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      border-radius: 4px;
      white-space: nowrap;
      transition: background .1s;
    }
    .hdr-menu-item:hover { background: var(--g-color-base-generic); }
    .hdr-menu-item:active { background: var(--g-color-base-generic-hover); }

    /* ── Toolbar row ───────────────────────────────────────────── */
    .hdr-toolbar-row {
      display: flex;
      align-items: center;
      height: 26px;
      padding: 0 var(--g-spacing-2);   /* 0 8px */
      gap: 1px;
      flex-shrink: 0;
      background: var(--g-color-base-generic);
      border-top: 1px solid var(--g-color-line-generic-solid);
      overflow: hidden;
    }

    .tb-btn {
      height: 22px;
      min-width: 22px;
      border: none;
      background: none;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--g-color-text-primary);
      font-size: 13px;
      font-family: var(--g-font-family-sans);
      padding: 0 4px;
      transition: background .1s;
      gap: 2px;
    }
    .tb-btn:hover { background: var(--g-color-base-generic-hover); }
    .tb-btn:active { background: var(--g-color-base-generic-medium); }
    .tb-btn:disabled { opacity: .35; cursor: default; }
    .tb-btn svg { width: 15px; height: 15px; flex-shrink: 0; }

    .tb-sep {
      width: 1px;
      height: 16px;
      background: var(--g-color-line-generic-solid);
      margin: 0 var(--g-spacing-1);   /* 0 4px */
      flex-shrink: 0;
    }

    .tb-select {
      height: 22px;
      border: 1px solid transparent;
      border-radius: 4px;
      background: none;
      font-size: 12px;
      font-family: var(--g-font-family-sans);
      color: var(--g-color-text-primary);
      cursor: pointer;
      padding: 0 var(--g-spacing-1);
      outline: none;
      transition: background .1s, border-color .1s;
    }
    .tb-select:hover {
      background: var(--g-color-base-generic-hover);
      border-color: var(--g-color-line-generic-solid);
    }
    .tb-select:focus {
      border-color: var(--g-color-line-focus);
      background: var(--g-color-base-background);
    }

    .tb-font-size {
      width: 34px;
      height: 22px;
      border: 1px solid var(--g-color-line-generic-solid);
      border-radius: 4px;
      font-size: 12px;
      font-family: var(--g-font-family-sans);
      text-align: center;
      outline: none;
      background: var(--g-color-base-background);
      color: var(--g-color-text-primary);
      padding: 0 2px;
    }
    .tb-font-size:focus { border-color: var(--g-color-line-focus); }

    /* Color swatch line under A / paint-bucket icon */
    .tb-color-swatch {
      width: 14px; height: 3px;
      border-radius: 2px;
    }

    .tb-bold   { font-weight: 700; }
    .tb-italic { font-style: italic; }
    .tb-under  { text-decoration: underline; }
    .tb-strike { text-decoration: line-through; }


    /* ============================================================
       WORKSPACE  —  Flexbox column
       Contains formula bar + grid, fills the left column.
       ============================================================ */
    .app-workspace {
      grid-column: 1;
      grid-row: 2;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0; /* prevent grid blowout on narrow viewports */
    }

    /* -- Formula Bar -------------------------------------------- */
    .formula-bar {
      flex: 0 0 var(--formula-bar-height);
      background-color: var(--color-formula-bar);
      overflow: hidden;
      /* Content: cell address box, fx label, formula input… */
    }

    /* -- Grid Area ---------------------------------------------- */
    .grid-area {
      flex: 1;
      overflow: hidden;
      background-color: var(--color-grid);
      position: relative;
    }

    /* ── Spreadsheet grid ──────────────────────────────────────── */
    .sg-root {
      display: grid;
      grid-template-rows: var(--col-header-height) 1fr;
      grid-template-columns: var(--row-header-width) 1fr;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* top-left corner cell */
    .sg-corner {
      grid-row: 1;
      grid-column: 1;
      background: var(--g-color-base-generic, #f8f8f8);
      border-right: 1px solid var(--cell-border);
      border-bottom: 1px solid var(--g-color-line-generic-active, #b0b0b0);
      z-index: 3;
      position: sticky;
      top: 0;
      left: 0;
    }

    /* Column headers strip (scrolls horizontally only) */
    .sg-col-headers-wrap {
      grid-row: 1;
      grid-column: 2;
      overflow: hidden;
      background: var(--g-color-base-generic, #f8f8f8);
      border-bottom: 1px solid var(--g-color-line-generic-active, #b0b0b0);
      z-index: 2;
    }

    .sg-col-headers {
      display: flex;
      height: var(--col-header-height);
      will-change: transform;
    }

    .sg-col-header {
      flex: 0 0 var(--cell-width);
      height: var(--col-header-height);
      border-right: 1px solid var(--cell-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-family: var(--g-font-family-sans, Arial, sans-serif);
      color: var(--g-color-text-complementary, #444);
      user-select: none;
      cursor: default;
      box-sizing: border-box;
      background: var(--g-color-base-generic, #f8f8f8);
      position: relative;
    }

    .sg-col-header.active {
      background: var(--g-color-base-brand, #f5c518);
      color: var(--g-color-text-brand-contrast, #1a1a1a);
    }

    /* Column resize handle */
    .sg-col-resize {
      position: absolute;
      right: 0;
      top: 0;
      width: 4px;
      height: 100%;
      cursor: col-resize;
      z-index: 1;
    }
    .sg-col-resize:hover { background: #1565c0; }

    /* Row headers strip (scrolls vertically only) */
    .sg-row-headers-wrap {
      grid-row: 2;
      grid-column: 1;
      overflow: hidden;
      background: var(--g-color-base-generic, #f8f8f8);
      border-right: 1px solid var(--g-color-line-generic-active, #b0b0b0);
      z-index: 2;
    }

    .sg-row-headers {
      will-change: transform;
    }

    .sg-row-header {
      width: var(--row-header-width);
      height: var(--cell-height);
      border-bottom: 1px solid var(--cell-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-family: var(--g-font-family-sans, Arial, sans-serif);
      color: var(--g-color-text-complementary, #444);
      user-select: none;
      cursor: default;
      box-sizing: border-box;
      background: var(--g-color-base-generic, #f8f8f8);
    }

    .sg-row-header.active {
      background: var(--g-color-base-brand, #f5c518);
      color: var(--g-color-text-brand-contrast, #1a1a1a);
    }

    /* Main scrollable body */
    .sg-body {
      grid-row: 2;
      grid-column: 2;
      overflow: auto;
      position: relative;
    }

    /* The big canvas-like div that holds all cells */
    .sg-cells {
      position: relative;
    }

    /* Row of cells */
    .sg-row {
      display: flex;
      height: var(--cell-height);
    }

    /* Individual cell */
    .sg-cell {
      flex: 0 0 var(--cell-width);
      height: var(--cell-height);
      border-right: 1px solid var(--cell-border);
      border-bottom: 1px solid var(--cell-border);
      box-sizing: border-box;
      position: relative;
      cursor: cell;
      font-size: 12px;
      font-family: var(--g-font-family-sans, Arial, sans-serif);
      color: var(--g-color-text-primary, #1a1a1a);
      white-space: nowrap;
      overflow: hidden;
      background: var(--g-color-base-background, #fff);
    }

    .sg-cell-text {
      display: block;
      width: 100%;
      height: 100%;
      padding: 0 3px;
      line-height: var(--cell-height);
      overflow: hidden;
      pointer-events: none;
    }

    /* Selected cell */
    .sg-cell.selected {
      outline: 2px solid #1a73e8;
      outline-offset: -2px;
      z-index: 1;
    }

    /* Inline editor input */
    .sg-editor {
      position: absolute;
      inset: 0;
      border: none;
      outline: none;
      padding: 0 3px;
      font-size: 13px;
      font-family: Calibri, Arial, sans-serif;
      color: #1a1a1a;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      z-index: 10;
      min-width: 100%;
      white-space: pre;
      overflow: hidden;
    }

    /* ── Formula bar ─────────────────────────────────────────────── */
    .formula-bar {
      flex: 0 0 var(--formula-bar-height);
      background: var(--g-color-base-background);
      overflow: hidden;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--g-color-line-generic-solid);
      padding: 0 var(--g-spacing-2);
      gap: var(--g-spacing-2);
    }

    .formula-name-box {
      flex: 0 0 72px;
      height: 22px;
      border: 1px solid var(--g-color-line-generic-solid);
      border-radius: 4px;
      background: var(--g-color-base-background);
      font-size: 12px;
      font-family: var(--g-font-family-sans);
      text-align: center;
      line-height: 22px;
      padding: 0 4px;
      color: var(--g-color-text-primary);
      overflow: hidden;
      white-space: nowrap;
    }

    .formula-fx {
      font-size: 13px;
      color: var(--g-color-text-complementary);
      font-style: italic;
      padding: 0 2px;
      user-select: none;
    }

    .formula-input {
      flex: 1;
      height: 22px;
      border: 1px solid var(--g-color-line-generic-solid);
      border-radius: 4px;
      background: var(--g-color-base-background);
      font-size: 13px;
      font-family: var(--g-font-family-sans);
      padding: 0 var(--g-spacing-1);
      color: var(--g-color-text-primary);
      outline: none;
    }
    .formula-input:focus { border-color: var(--g-color-line-focus); }

    /* ── Sheets bar ──────────────────────────────────────────────── */
    .sheets-bar {
      grid-column: 1 / -1;
      grid-row: 3;
      background: var(--g-color-base-background);
      border-top: 1px solid var(--g-color-line-generic-solid);
      display: flex;
      align-items: center;
      padding: 0 var(--g-spacing-2);
      gap: var(--g-spacing-1);
      overflow: hidden;
    }

    .sheet-tab {
      height: 22px;
      padding: 0 12px;
      border: 1px solid var(--g-color-line-generic-solid);
      border-bottom: none;
      border-radius: 4px 4px 0 0;
      background: var(--g-color-base-generic);
      font-size: 12px;
      font-family: var(--g-font-family-sans);
      color: var(--g-color-text-complementary);
      cursor: pointer;
      display: flex;
      align-items: center;
      user-select: none;
      transition: background .1s;
    }
    .sheet-tab:hover { background: var(--g-color-base-generic-hover); }

    .sheet-tab.active {
      background: var(--g-color-base-background);
      border-color: var(--g-color-line-generic-solid);
      color: var(--g-color-text-brand);
      font-weight: 600;
    }

    .sheet-tab-add {
      height: 22px;
      width: 22px;
      border: none;
      border-radius: 4px;
      background: none;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--g-color-text-complementary);
      margin-left: var(--g-spacing-1);
      transition: background .1s;
    }
    .sheet-tab-add:hover { background: var(--g-color-base-generic-hover); }


    /* ============================================================
       SIDEBAR
       Right panel. Width is controlled via --sidebar-width.
       ============================================================ */
    .app-sidebar {
      grid-column: 2;
      grid-row: 2;
      position: relative;
      overflow: hidden;
      background-color: var(--color-sidebar);
      /* Content: property panels, charts, formatting… */
    }

    /* Resize handle — sits on the left edge of the sidebar */
    .sidebar-resize-handle {
      position: absolute;
      inset: 0 auto 0 0; /* top:0 right:auto bottom:0 left:0 */
      width: var(--resize-handle-size);
      cursor: col-resize;
      z-index: 10;
      transition: background-color 0.15s;
    }

    .sidebar-resize-handle:hover,
    .sidebar-resize-handle.is-dragging {
      background-color: var(--color-resize-hover);
    }

    /* Hide resize affordance when sidebar is collapsed */
    .app.sidebar-hidden .sidebar-resize-handle {
      display: none;
    }


    /* ============================================================
       SHEETS BAR
       Spans all columns. Fixed — does not scroll.
       ============================================================ */
    .sheets-bar {
      grid-column: 1 / -1;
      grid-row: 3;
      background-color: var(--color-sheets-bar);
      overflow: hidden;
      /* Content: sheet tabs, add-sheet button… */
    }
  </style>
</head>
<body class="g-root g-root_theme_light">

<div class="app" id="app">

  <!-- =====================================================
       HEADER
       Toolbar rows, menu bar, window controls, etc.
       ===================================================== -->
  <header class="app-header" id="appHeader">

    <!-- Background image pinned to top-right -->
    <div class="hdr-bg">
      <img src="bg_ss.svg" alt="" width="1280" height="122">
    </div>

    <!-- Title row -->
    <div class="hdr-title-row">
      <div class="hdr-logo-icon"></div>
      <div class="hdr-title">Книга без названия</div>

      <div class="hdr-title-actions">
        <!-- Star -->
        <button class="hdr-icon-btn" title="Добавить в избранное">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        </button>
        <!-- Move to folder -->
        <button class="hdr-icon-btn" title="Переместить">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
        </button>
        <!-- Clock / history -->
        <button class="hdr-icon-btn" title="История версий">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
        </button>
        <!-- Cloud saved -->
        <button class="hdr-icon-btn" title="Сохранено на диск">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.35 10.04A7.49 7.49 0 0 0 12 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 0 0 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM10 17l-3.5-3.5 1.41-1.41L10 14.17 15.18 9l1.41 1.41L10 17z"/></svg>
        </button>
        <button class="hdr-share-btn">Поделиться</button>
        <div class="hdr-avatar" title="Аккаунт">А</div>
      </div>
    </div>

    <!-- Menu row -->
    <div class="hdr-menu-row">
      <span class="hdr-menu-item">Файл</span>

  <!-- =====================================================

  <div class="app-workspace" id="appWorkspace">

    <div class="formula-bar" id="formulaBar">
      <div class="formula-name-box" id="nameBox">A1</div>
      <span class="formula-fx">fx</span>
      <input class="formula-input" id="formulaInput" type="text" autocomplete="off" spellcheck="false">
    </div>

    <div class="grid-area" id="gridArea">
      <div class="sg-root" id="sgRoot">
        <div class="sg-corner"></div>
        <div class="sg-col-headers-wrap" id="sgColHeadersWrap">
          <div class="sg-col-headers" id="sgColHeaders"></div>
        </div>
        <div class="sg-row-headers-wrap" id="sgRowHeadersWrap">
          <div class="sg-row-headers" id="sgRowHeaders"></div>
        </div>
        <div class="sg-body" id="sgBody">
          <div class="sg-cells" id="sgCells"></div>
        </div>
      </div>
    </div>

  </div>

  <!-- =====================================================
       SIDEBAR
       Right-side panel. Resizable via drag handle.
       Toggle visibility with layout.toggleSidebar().
       ===================================================== -->

    <div class="sidebar-resize-handle" id="sidebarResizeHandle"></div>
    <!-- SLOT: sidebar content -->
  </aside>

  <!-- =====================================================
       SHEETS BAR
       Sheet tabs, navigation controls.
       ===================================================== -->
  <div class="sheets-bar" id="sheetsBar">
    <div class="sheet-tab active" data-sheet="0">Лист 1</div>
    <div class="sheet-tab" data-sheet="1">Сводная таблица</div>
    <button class="sheet-tab-add" title="Добавить лист">+</button>

</div><!-- /.app -->


<script>
  (() => {
    'use strict';

    const root = document.documentElement;
    const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);
    const getCSSPx = (prop) => parseInt(getComputedStyle(root).getPropertyValue(prop).trim(), 10);

    // ── Column label helper (0→A, 25→Z, 26→AA …) ─────────────────────────
    function colLabel(n) {
      let s = '';
      n++;
      while (n > 0) {
        n--;
        s = String.fromCharCode(65 + (n % 26)) + s;
        n = Math.floor(n / 26);
      }
      return s;
    }

    // ── Grid dimensions ───────────────────────────────────────────────────
    const ROWS = 100;
    const COLS = 26;

    // data store: sparse object { 'r,c': value }
    const DATA = {};

    // ── DOM refs ──────────────────────────────────────────────────────────
    const nameBox      = document.getElementById('nameBox');
    const formulaInput = document.getElementById('formulaInput');
    const sgColHeaders = document.getElementById('sgColHeaders');
    const sgRowHeaders = document.getElementById('sgRowHeaders');
    const sgCells      = document.getElementById('sgCells');
    const sgBody       = document.getElementById('sgBody');
    const sgColHeadersWrap = document.getElementById('sgColHeadersWrap');
    const sgRowHeadersWrap = document.getElementById('sgRowHeadersWrap');

    // ── Selection state ───────────────────────────────────────────────────
    let selRow = 0, selCol = 0;
    let editingCell = null; // { row, col, el, input }

    // Column widths (overridden by drag)
    const colWidths = Array.from({ length: COLS }, () => getCSSPx('--cell-width'));
    const rowHeight = getCSSPx('--cell-height');

    // ── Build column headers ───────────────────────────────────────────────
    function buildColHeaders() {
      sgColHeaders.innerHTML = '';
      let offsetX = 0;
      for (let c = 0; c < COLS; c++) {
        const w = colWidths[c];
        const div = document.createElement('div');
        div.className = 'sg-col-header';
        div.style.flex = `0 0 ${w}px`;
        div.textContent = colLabel(c);
        div.dataset.col = c;

        // resize handle
        const rh = document.createElement('div');
        rh.className = 'sg-col-resize';
        rh.dataset.col = c;
        div.appendChild(rh);

        sgColHeaders.appendChild(div);
        offsetX += w;
      }
    }

    // ── Build row headers ──────────────────────────────────────────────────
    function buildRowHeaders() {
      sgRowHeaders.innerHTML = '';
      for (let r = 0; r < ROWS; r++) {
        const div = document.createElement('div');
        div.className = 'sg-row-header';
        div.style.height = `${rowHeight}px`;
        div.textContent = r + 1;
        div.dataset.row = r;
        sgRowHeaders.appendChild(div);
      }
    }

    // ── Build cell grid ────────────────────────────────────────────────────
    function buildCells() {
      sgCells.innerHTML = '';
      for (let r = 0; r < ROWS; r++) {
        const row = document.createElement('div');
        row.className = 'sg-row';
        row.style.height = `${rowHeight}px`;
        row.dataset.row = r;
        for (let c = 0; c < COLS; c++) {
          const cell = document.createElement('div');
          cell.className = 'sg-cell';
          cell.style.flex = `0 0 ${colWidths[c]}px`;
          cell.dataset.row = r;
          cell.dataset.col = c;
          const span = document.createElement('span');
          span.className = 'sg-cell-text';
          span.textContent = DATA[`${r},${c}`] || '';
          cell.appendChild(span);
          row.appendChild(cell);
        }
        sgCells.appendChild(row);
      }
    }

    // ── Update header + cell highlights ───────────────────────────────────
    function updateHighlights() {
      // col headers
      sgColHeaders.querySelectorAll('.sg-col-header').forEach(el => {
        el.classList.toggle('active', +el.dataset.col === selCol);
      });
      // row headers
      sgRowHeaders.querySelectorAll('.sg-row-header').forEach(el => {
        el.classList.toggle('active', +el.dataset.row === selRow);
      });
      // cells
      sgCells.querySelectorAll('.sg-cell').forEach(el => {
        const r = +el.dataset.row, c = +el.dataset.col;
        el.classList.toggle('selected', r === selRow && c === selCol);
      });
      // name box
      nameBox.textContent = `${colLabel(selCol)}${selRow + 1}`;
      // formula bar
      formulaInput.value = DATA[`${selRow},${selCol}`] || '';
    }

    function selectCell(r, c, scroll = true) {
      r = clamp(r, 0, ROWS - 1);
      c = clamp(c, 0, COLS - 1);
      selRow = r; selCol = c;
      updateHighlights();

      if (scroll) {
        // scroll body so cell is visible
        const x = colWidths.slice(0, c).reduce((a, v) => a + v, 0);
        const y = r * rowHeight;
        const bw = sgBody.clientWidth, bh = sgBody.clientHeight;
        const sx = sgBody.scrollLeft, sy = sgBody.scrollTop;
        const cw = colWidths[c];
        if (x < sx)            sgBody.scrollLeft = x;
        if (x + cw > sx + bw)  sgBody.scrollLeft = x + cw - bw;
        if (y < sy)            sgBody.scrollTop  = y;
        if (y + rowHeight > sy + bh) sgBody.scrollTop = y + rowHeight - bh;
      }
    }

    // ── Inline editor ─────────────────────────────────────────────────────
    function startEdit(r, c, initialChar) {
      if (editingCell) commitEdit();

      const cellEl = sgCells.querySelector(`.sg-cell[data-row="${r}"][data-col="${c}"]`);
      if (!cellEl) return;

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'sg-editor';
      input.value = initialChar !== undefined ? initialChar : (DATA[`${r},${c}`] || '');
      if (initialChar !== undefined) {
        // cursor to end
        setTimeout(() => { input.selectionStart = input.selectionEnd = input.value.length; }, 0);
      }
      cellEl.appendChild(input);
      input.focus();
      if (initialChar === undefined) input.select();

      editingCell = { row: r, col: c, el: cellEl, input };

      input.addEventListener('input', () => {
        formulaInput.value = input.value;
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          commitEdit();
          selectCell(r + 1, c);
          e.preventDefault();
        } else if (e.key === 'Tab') {
          commitEdit();
          selectCell(r, c + (e.shiftKey ? -1 : 1));
          e.preventDefault();
        } else if (e.key === 'Escape') {
          cancelEdit();
          e.preventDefault();
        }
        e.stopPropagation();
      });

      input.addEventListener('blur', () => {
        commitEdit();
      });
    }

    function commitEdit() {
      if (!editingCell) return;
      const { row, col, el, input } = editingCell;
      const val = input.value;
      if (val === '') {
        delete DATA[`${row},${col}`];
      } else {
        DATA[`${row},${col}`] = val;
      }
      const span = el.querySelector('.sg-cell-text');
      span.textContent = val;
      el.removeChild(input);
      editingCell = null;
      formulaInput.value = DATA[`${selRow},${selCol}`] || '';
    }

    function cancelEdit() {
      if (!editingCell) return;
      const { el, input } = editingCell;
      el.removeChild(input);
      editingCell = null;
    }

    // ── Cell mouse events ─────────────────────────────────────────────────
    sgCells.addEventListener('mousedown', (e) => {
      const cell = e.target.closest('.sg-cell');
      if (!cell) return;
      const r = +cell.dataset.row, c = +cell.dataset.col;
      if (editingCell && (editingCell.row !== r || editingCell.col !== c)) {
        commitEdit();
      }
      selectCell(r, c, false);
      e.preventDefault();
    });

    sgCells.addEventListener('dblclick', (e) => {
      const cell = e.target.closest('.sg-cell');
      if (!cell) return;
      startEdit(+cell.dataset.row, +cell.dataset.col, undefined);
    });

    // ── Formula bar sync ──────────────────────────────────────────────────
    formulaInput.addEventListener('input', () => {
      if (!editingCell) {
        // Start editing current cell via formula bar
        const cellEl = sgCells.querySelector(`.sg-cell[data-row="${selRow}"][data-col="${selCol}"]`);
        if (cellEl) {
          const input = document.createElement('input');
          input.type = 'text';
          input.className = 'sg-editor';
          input.value = formulaInput.value;
          cellEl.appendChild(input);
          // keep focus on formula bar
          editingCell = { row: selRow, col: selCol, el: cellEl, input };
          input.addEventListener('blur', () => commitEdit());
        }
      } else {
        editingCell.input.value = formulaInput.value;
      }
    });

    formulaInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        commitEdit();
        selectCell(selRow + 1, selCol);
        e.preventDefault();
      } else if (e.key === 'Escape') {
        cancelEdit();
        formulaInput.value = DATA[`${selRow},${selCol}`] || '';
        e.preventDefault();
      }
    });

    // ── Keyboard navigation ───────────────────────────────────────────────
    document.addEventListener('keydown', (e) => {
      if (editingCell) return;
      if (document.activeElement === formulaInput) return;

      const nav = {
        ArrowUp:    [-1,  0],
        ArrowDown:  [ 1,  0],
        ArrowLeft:  [ 0, -1],
        ArrowRight: [ 0,  1],
        Tab:        [ 0,  e.shiftKey ? -1 : 1],
        Enter:      [ 1,  0],
      };
      if (nav[e.key]) {
        selectCell(selRow + nav[e.key][0], selCol + nav[e.key][1]);
        if (e.key === 'Tab') e.preventDefault();
        return;
      }
      // Delete / Backspace → clear cell
      if (e.key === 'Delete' || e.key === 'Backspace') {
        delete DATA[`${selRow},${selCol}`];
        const cellEl = sgCells.querySelector(`.sg-cell[data-row="${selRow}"][data-col="${selCol}"]`);
        if (cellEl) cellEl.querySelector('.sg-cell-text').textContent = '';
        formulaInput.value = '';
        return;
      }
      // Printable char → start edit
      if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
        startEdit(selRow, selCol, e.key);
      }
      if (e.key === 'F2') {
        startEdit(selRow, selCol, undefined);
      }
    });

    // ── Sync scroll: body → headers ───────────────────────────────────────
    sgBody.addEventListener('scroll', () => {
      sgColHeadersWrap.scrollLeft = sgBody.scrollLeft;
      sgRowHeadersWrap.scrollTop  = sgBody.scrollTop;
      // translate headers for pixel-perfect sync
      sgColHeaders.style.transform = `translateX(-${sgBody.scrollLeft}px)`;
      sgRowHeaders.style.transform = `translateY(-${sgBody.scrollTop}px)`;
    });

    // ── Column resize by drag ─────────────────────────────────────────────
    let colResizing = null;

    sgColHeaders.addEventListener('mousedown', (e) => {
      const rh = e.target.closest('.sg-col-resize');
      if (!rh) return;
      const c = +rh.dataset.col;
      colResizing = { col: c, startX: e.clientX, startW: colWidths[c] };
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
      e.preventDefault();
    });

    document.addEventListener('mousemove', (e) => {
      if (!colResizing) return;
      const { col, startX, startW } = colResizing;
      const newW = Math.max(20, startW + e.clientX - startX);
      colWidths[col] = newW;
      // update header
      sgColHeaders.children[col].style.flex = `0 0 ${newW}px`;
      // update all cells in that column
      sgCells.querySelectorAll(`.sg-cell[data-col="${col}"]`).forEach(el => {
        el.style.flex = `0 0 ${newW}px`;
      });
    });

    document.addEventListener('mouseup', () => {
      if (!colResizing) return;
      colResizing = null;
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
    });

    // ── Sidebar resize ────────────────────────────────────────────────────
    const app          = document.getElementById('app');
    const resizeHandle = document.getElementById('sidebarResizeHandle');

    let sbDragging = false, sbStartX = 0, sbStartW = 0;

    resizeHandle.addEventListener('mousedown', (e) => {
      sbDragging = true;
      sbStartX   = e.clientX;
      sbStartW   = getCSSPx('--sidebar-width');
      resizeHandle.classList.add('is-dragging');
      document.body.style.cursor     = 'col-resize';
      document.body.style.userSelect = 'none';
      e.preventDefault();
    });

    document.addEventListener('mousemove', (e) => {
      if (!sbDragging) return;
      const delta    = sbStartX - e.clientX;
      const minWidth = getCSSPx('--sidebar-min-width');
      const maxWidth = getCSSPx('--sidebar-max-width');
      const newWidth = clamp(sbStartW + delta, minWidth, maxWidth);
      root.style.setProperty('--sidebar-width', `${newWidth}px`);
    });

    document.addEventListener('mouseup', () => {
      if (!sbDragging) return;
      sbDragging = false;
      resizeHandle.classList.remove('is-dragging');
      document.body.style.cursor     = '';
      document.body.style.userSelect = '';
    });

    // ── Sheet tabs ────────────────────────────────────────────────────────
    document.getElementById('sheetsBar').addEventListener('click', (e) => {
      const tab = e.target.closest('.sheet-tab');
      if (!tab) return;
      document.querySelectorAll('.sheet-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
    });

    // ── Init ──────────────────────────────────────────────────────────────
    buildColHeaders();
    buildRowHeaders();
    buildCells();
    selectCell(0, 0, false);

    // Public API
    window.layout = {
      toggleSidebar(force) {
        if (typeof force === 'boolean') app.classList.toggle('sidebar-hidden', !force);
        else app.classList.toggle('sidebar-hidden');
      },
      setSidebarWidth(px) {
        const lo = getCSSPx('--sidebar-min-width'), hi = getCSSPx('--sidebar-max-width');
        root.style.setProperty('--sidebar-width', `${clamp(px, lo, hi)}px`);
      },
      getSidebarWidth() { return getCSSPx('--sidebar-width'); },
      getData() { return { ...DATA }; },
      setCell(r, c, v) {
        const key = `${r},${c}`;
        if (v == null || v === '') delete DATA[key];
        else DATA[key] = String(v);
        const el = sgCells.querySelector(`.sg-cell[data-row="${r}"][data-col="${c}"]`);
        if (el) el.querySelector('.sg-cell-text').textContent = DATA[key] || '';
      },
    };
  })();
</script>

</body>
</html>
